name: 每日掃描
# 美股收市後跑 scanner/scan.py，更新 docs/scan.json（GitHub Pages 會自動發佈）
on:
  schedule:
    - cron: "30 22 * * 1-5"    # 22:30 UTC = 香港時間 06:30（夏令時間收市後 2.5 小時，冬令 1.5 小時）
  workflow_dispatch:          # 可以喺 Actions 頁面手動按 Run workflow
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/scan.py
        env:
          PYTHONIOENCODING: utf-8
      - name: 模型帳戶（照 V2.1 行虛擬帳戶）
        run: python scanner/model.py
        env:
          PYTHONIOENCODING: utf-8
      - name: 提交新數據
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scan.json docs/model.json scanner/universe.txt scanner/sectors.json
          if git diff --cached --quiet; then echo "冇新數據"; else git commit -m "每日掃描 $(date -u +%F)" && git push; fi
