name: 每日掃描
# 美股收市後跑 scanner/scan.py，更新 docs/scan.json（GitHub Pages 會自動發佈）
on:
  schedule:
    - cron: "43 22 * * 1-5"    # 22:43 UTC = 香港時間 06:43（夏令時間收市後約 2.7 小時，冬令 1.7 小時）；2026-10-14 由 22:30 改，避開半點
  workflow_dispatch:          # 可以喺 Actions 頁面手動按 Run workflow
permissions:
  contents: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150          # 2026-10-21：掃描最多等 Yahoo 約 2 個鐘（見下面），原本 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      # 2026-10-21：10-20、10-21 兩日 3 次都唔得：Yahoo 最新一日日線要美東收市後約 5.5–6 個鐘先齊（UTC 01:30 仲得幾隻、01:50 齊），排程 00:45–01:15 跑太早
      - name: 每日掃描（Yahoo 數據唔齊就等 10 分鐘再試，最多 9 次，約 2 個鐘）
        run: for i in $(seq 1 9); do python scanner/scan.py && exit 0; [ $i -lt 9 ] && { echo "第 $i 次唔得，10 分鐘後再試"; sleep 600; }; done; exit 1
        env:
          PYTHONIOENCODING: utf-8
      - name: 2 倍個股 ETF 對照（失敗唔影響）
        run: python scanner/lev2x.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      - name: 模型帳戶 = 延續帳戶（2000 年起 V2.7 回測喺 2026-09-22 嘅狀態，雲端照規則繼續行）
        run: python scanner/model.py cont
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}          # 退市／拆股 AI 查證（llm.py：Claude 優先、Gemini 後備；冇搜尋來源唔改帳）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 估值（大市、指數、排名同持倉個股；失敗唔影響其他）
        run: python scanner/valuation.py
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
      - name: 提交新數據
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scan.json docs/model_cont.json docs/lev2x.json docs/valuation.json scanner/universe.txt scanner/sectors.json
          if git diff --cached --quiet; then echo "冇新數據"; else git commit -m "每日掃描 $(date -u +%F)" && git push; fi
