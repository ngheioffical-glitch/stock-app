name: 新聞同經濟數據
# 新聞同經濟日曆密啲更新；其他（加密、債息、商品、外匯、Trump、Serenity、業績、AI 宏觀思考等）淨係全部更新排程先做；推去 feeds 分支（每次覆蓋，唔留歷史）；app 由 raw.githubusercontent.com 讀
# 2026-10-24 老師：「唔建議更新得咁密，淨係新聞密就得，其他全部淨係排程，除非user自己撳refresh」→ guard 輸出 full（scanner/feeds_gate.py）：
#   full=1 全部做：下面標「全部」嘅排程（cron 字串要同 feeds_gate.py 嘅 FULL_CRONS 一樣）、app 撳「重新整理」、改呢個檔 push
#   full=0 淨係新聞：其他排程、app 開嗰陣自動更新（relay=1）；其他檔沿用上一份
#   GitHub 成日跳排程（10-24 19:41 嗰次全部更新遲咗 3 個鐘）：任何排程，上次全部更新（feeds/full_at.txt）超過 14 個鐘就做全部
on:
  schedule:
    - cron: "41 10,12 * * 1-5"    # 開市前新聞：香港 18:41、20:41（GitHub 每日嘅排程通常會行，只係遲，開市前試多幾次；2026-10-23 拎走 17:41 DeepSeek 繁忙時段）
    - cron: "41 11 * * *"         # 全部：香港 19:41（每日；週末加密都更新）
    - cron: "11 13 * * 1-5"       # 全部：開市前最後一次（香港 21:11；夏令紐約 09:11，冬令 08:11）
    - cron: "29 22 * * *"         # 全部：香港 06:29（每日，美股收市後）
    - cron: "7,22,37,52 * * * *"   # 新聞：每 15 分鐘，guard 再揀行唔行（2026-10-14 避開整點，GitHub 整點最多人排）；今日重點喺 ai.py 限制每 45 分鐘先寫一次
  workflow_dispatch:
    inputs:
      relay:               # "1" = 自動（2026-10-15 起係 app 開嗰陣新聞超過 15 分鐘自動更新），淨係新聞、唔強制重寫 AI；app 撳「重新整理」唔傳 → 當手動（全部更新、強制重寫 AI）
        required: false
        default: ""
  push:                    # 2026-10-03：改呢個檔 push 上嚟就即刻跑一次
    branches: [main]
    paths: [.github/workflows/feeds.yml]
permissions:
  contents: write
concurrency:              # 2026-10-20：Claude Opus high 慢過 Gemini，一次可以行十幾分鐘；唔好兩次同時行（重複畀錢）
  group: feeds
  cancel-in-progress: false
# 2026-10-06：GitHub 帳戶被封（好大機會因為 10-03 加嘅「接力」：每 5 分鐘自己觸發自己、24 小時唔停，似長期伺服器用途）。
# 已拎走接力。解封後唔好再加任何自己觸發自己嘅設計。
# 2026-10-15：GitHub 排程唔準時（幾個鐘先跑一次），用戶揀「開 app 自動更新」（app 用手機 token 觸發 workflow_dispatch，relay=1）；
#   排程只做後備，由 guard 嘅 scanner/feeds_gate.py 決定行唔行：開市時間行；收市後 Nasdaq 期貨再郁 0.75% 即刻行，否則每 4 個鐘；10 分鐘內啱啱更新過就唔行。
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
      fut: ${{ steps.g.outputs.fut }}
      fut_b: ${{ steps.g.outputs.fut_b }}
      fut_d: ${{ steps.g.outputs.fut_d }}
      pre: ${{ steps.g.outputs.pre }}
      fut_now: ${{ steps.g.outputs.fut_now }}
      full: ${{ steps.g.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scanner/feeds_gate.py
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          last=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/commits/feeds" | python3 -c "import json,sys,datetime;d=json.load(sys.stdin);print(int(datetime.datetime.fromisoformat(d['commit']['committer']['date'].replace('Z','+00:00')).timestamp()))" || echo 0)
          full_at=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/feeds/full_at.txt" || echo 0)   # 上次全部更新（GitHub 跳咗全部更新排程時用）
          python3 scanner/feeds_gate.py "${{ github.event_name }}" "$last" "${{ github.event.schedule }}" "${{ github.event.inputs.relay }}" "$full_at"
  feeds:
    needs: guard
    if: needs.guard.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 攞上一份 feeds 分支（2026-10-24：用 git，唔經 raw.githubusercontent 約 5 分鐘快取；AI 用量帳本放入 out 俾 llm.py 接住計）
        run: |
          mkdir -p prev out
          if git fetch -q --depth 1 origin feeds; then
            for f in $(git ls-tree --name-only FETCH_HEAD); do git show "FETCH_HEAD:$f" > "prev/$f"; done
          fi
          if [ -f prev/ai_usage.json ]; then cp prev/ai_usage.json out/; fi
      - run: python scanner/feeds.py out
        env:
          PYTHONIOENCODING: utf-8
      - name: 淨係新聞：其他檔沿用上一份（推去 feeds 分支係成個覆蓋，唔抄返就會唔見）
        if: needs.guard.outputs.full != '1'
        run: |
          for f in serenity_recent.json trump_recent.json btc.json fng.json hyper.json rates.json commod.json fx.json walert.json earnings.json macro_src.json; do
            if [ -f "prev/$f" ]; then cp "prev/$f" "out/$f"; fi
          done
      - name: Serenity 近 3 日（全部更新先抓；失敗就沿用上一份，唔影響新聞）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/serenity_recent.json" -o out/serenity_recent.json || true
          python scanner/serenity.py recent out
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONIOENCODING: utf-8
      - name: Trump Truth Social 近 3 日（全部更新先抓；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/trump_recent.json" -o out/trump_recent.json || true
          python scanner/trump.py recent out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 比特幣燈號（365 日線、MVRV、資金費率、利率；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          pip install -q pandas
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/btc.json" -o out/btc.json || true
          python scanner/btc.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 恐慌貪婪指數（股市 CNN、加密 alternative.me；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/fng.json" -o out/fng.json || true
          python scanner/fng.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: Hyperliquid 巨鯨持倉（全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/hyper.json" -o out/hyper.json || true
          python scanner/hyper.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 美債息（財政部官方 + Yahoo 盤中；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/rates.json" -o out/rates.json || true
          python scanner/rates.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 商品（原油、黃金、白銀、銅；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/commod.json" -o out/commod.json || true
          python scanner/commod.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 外匯（美元指數、日圓、歐元、人民幣、瑞郎；2026-10-25；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          if [ -f prev/fx.json ]; then cp prev/fx.json out/; fi
          python scanner/fx.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 大額轉帳（Whale Alert X；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/walert.json" -o out/walert.json || true
          python scanner/walert.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 業績重點（持倉 + 排名頭 15；全部更新先做，而且每 55 分鐘最多一次；AI 上網搜尋，Gemini 後備；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/earnings.json" -o out/earnings.json || true
          pip install -q yfinance pandas anthropic
          python scanner/earnings.py out
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
          RELAY: ${{ github.event.inputs.relay }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DDEEPSEEK_API_KEY }}   # 2026-10-23：有就用 DeepSeek（收錢，有每日／試用上限）；老師開嘅 Secret 叫 DDEEPSEEK_API_KEY，兩個名都收
          AI_LEDGER: feeds                                     # 跨流程 AI 用量帳本（llm.py）
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}     # 2026-10-22：有就由 Mistral（免費）做唔使上網嘅 AI
      - name: 宏觀來源（X 知名人士、Polymarket；全部更新先做；失敗就沿用上一份）
        if: needs.guard.outputs.full == '1'
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/macro_src.json" -o out/macro_src.json || true
          python scanner/macro_src.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: AI 翻譯、經濟數據解讀、今日重點（每次）；宏觀思考、加密重點、大額轉帳、商品分析（全部更新先做）；DeepSeek 主力、Gemini 後備（會標明）；出錯都唔影響新聞
        run: |
          pip install -q anthropic
          python scanner/ai.py out
        continue-on-error: true
        timeout-minutes: 13           # 2026-10-20：Opus high 慢過 Gemini；ai.py 自己有 AI_BUDGET_SEC（預設 540 秒）時間預算
        env:
          PYTHONIOENCODING: utf-8
          RELAY: ${{ github.event.inputs.relay }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DDEEPSEEK_API_KEY }}   # 2026-10-23：有就用 DeepSeek（收錢，有每日／試用上限）；老師開嘅 Secret 叫 DDEEPSEEK_API_KEY，兩個名都收
          AI_LEDGER: feeds                                     # 跨流程 AI 用量帳本（llm.py）
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}     # 2026-10-22：有就由 Mistral（免費）做唔使上網嘅 AI
          FUT_ALERT: ${{ needs.guard.outputs.fut }}
          FUT_BUCKET: ${{ needs.guard.outputs.fut_b }}
          FUT_DAY: ${{ needs.guard.outputs.fut_d }}
          PREMARKET: ${{ needs.guard.outputs.pre }}
          FUT_NOW: ${{ needs.guard.outputs.fut_now }}
          FEEDS_FULL: ${{ needs.guard.outputs.full }}          # 2026-10-24：0 = 淨係新聞（ai.py 唔寫宏觀思考、加密、大額轉帳、商品分析）
          FEEDS_PREV: prev                                     # 2026-10-24：上一份用 git 攞咗嘅（ai.py prev() 優先讀）
      - name: 推去 feeds 分支
        working-directory: out
        run: |
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f ai_usage.json ] || curl -sfL -o ai_usage.json "https://raw.githubusercontent.com/${{ github.repository }}/feeds/ai_usage.json" || true   # 今次冇用 AI 都要保留 AI 用量帳本（收錢 AI 試用累計靠佢）
          git add news.json econ.json $(ls serenity_recent.json trump_recent.json btc.json fng.json hyper.json rates.json commod.json fx.json walert.json earnings.json macro_src.json ai_usage.json 2>/dev/null)
          if [ "${{ needs.guard.outputs.full }}" = "1" ]; then date -u +%s > full_at.txt; elif [ -f ../prev/full_at.txt ]; then cp ../prev/full_at.txt .; fi   # 上次全部更新時間（feeds_gate.py 用）
          if [ -f full_at.txt ]; then git add full_at.txt; fi
          git commit -q -m "feeds $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" feeds
