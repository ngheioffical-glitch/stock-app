name: 新聞同經濟數據
# 每 30 分鐘抓新聞同經濟日曆，推去 feeds 分支（每次覆蓋，唔留歷史）；app 由 raw.githubusercontent.com 讀
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: true
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scanner/feeds.py out
        env:
          PYTHONIOENCODING: utf-8
      - name: 推去 feeds 分支
        working-directory: out
        run: |
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json econ.json
          git commit -q -m "feeds $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" feeds
