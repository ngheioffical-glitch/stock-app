name: 新聞同經濟數據
# 每 5 分鐘抓新聞同經濟日曆，推去 feeds 分支（每次覆蓋，唔留歷史）；app 由 raw.githubusercontent.com 讀
on:
  schedule:
    - cron: "*/5 * * * *"      # 2026-09-30：新聞改每 5 分鐘（GitHub 實際會遲幾分鐘）；翻譯即時；今日重點喺 ai.py 限制每 28 分鐘先寫一次
  workflow_dispatch:
    inputs:
      relay:               # 2026-10-05：接力觸發會傳 "1"；app「重新整理」唔傳 → 只有 app 先當手動（強制重寫 AI）
        required: false
        default: ""
  push:                    # 2026-10-03：改呢個檔 push 上嚟就即刻跑一次
    branches: [main]
    paths: [.github/workflows/feeds.yml]
permissions:
  contents: write
  actions: write          # 接力：跑完觸發下一次（GitHub 排程會遲甚至停 2 個鐘）
  models: read            # GitHub Models：Gemini 失敗時嘅 AI 後備（用內置 GITHUB_TOKEN）
# 2026-10-06：唔再用 concurrency 互相取消（每 5 分鐘一個「cancelled」，用戶收到好多 GitHub 電郵）。
# 改為 guard：排程觸發時，如果 feeds 分支 8 分鐘內有更新（接力鏈仲行緊）就跳過（skipped 唔會寄電郵）；接力鏈斷咗先由排程重新接上。
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/commits/feeds" | python3 -c "import json,sys,datetime;d=json.load(sys.stdin);print(int(datetime.datetime.fromisoformat(d['commit']['committer']['date'].replace('Z','+00:00')).timestamp()))" || echo 0)
          age=$(( $(date +%s) - last ))
          echo "feeds 分支 $age 秒前更新"
          if [ "$age" -lt 480 ]; then echo "run=0" >> "$GITHUB_OUTPUT"; else echo "run=1" >> "$GITHUB_OUTPUT"; fi
  feeds:
    needs: guard
    if: needs.guard.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scanner/feeds.py out
        env:
          PYTHONIOENCODING: utf-8
      - name: Serenity 近 3 日（每次都抓；失敗就沿用上一份，唔影響新聞）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/serenity_recent.json" -o out/serenity_recent.json || true
          python scanner/serenity.py recent out
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONIOENCODING: utf-8
      - name: Trump Truth Social 近 3 日（每次都抓；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/trump_recent.json" -o out/trump_recent.json || true
          python scanner/trump.py recent out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 比特幣燈號（365 日線、MVRV、資金費率、利率；失敗就沿用上一份）
        run: |
          pip install -q pandas
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/btc.json" -o out/btc.json || true
          python scanner/btc.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 恐慌貪婪指數（股市 CNN、加密 alternative.me；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/fng.json" -o out/fng.json || true
          python scanner/fng.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: Hyperliquid 巨鯨持倉（失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/hyper.json" -o out/hyper.json || true
          python scanner/hyper.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: 美債息（財政部官方 + Yahoo 盤中；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/rates.json" -o out/rates.json || true
          python scanner/rates.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 商品（原油、黃金、白銀、銅；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/commod.json" -o out/commod.json || true
          python scanner/commod.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 大額轉帳（Whale Alert X；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/walert.json" -o out/walert.json || true
          python scanner/walert.py out
        continue-on-error: true
        timeout-minutes: 2
        env:
          PYTHONIOENCODING: utf-8
      - name: 業績重點（持倉 + 排名頭 15；每 55 分鐘先做；Gemini + Google 搜尋；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/earnings.json" -o out/earnings.json || true
          pip install -q yfinance pandas
          python scanner/earnings.py out
        continue-on-error: true
        timeout-minutes: 6
        env:
          PYTHONIOENCODING: utf-8
          RELAY: ${{ github.event.inputs.relay }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 宏觀來源（X 知名人士每 30 分鐘、Polymarket 每次；失敗就沿用上一份）
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/feeds/macro_src.json" -o out/macro_src.json || true
          python scanner/macro_src.py out
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
      - name: AI 翻譯（新聞 + 加密 + Serenity + Trump，即時）、今日重點、加密重點；Gemini 優先、GitHub Models 後備；出錯都唔影響新聞
        run: python scanner/ai.py out
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
          RELAY: ${{ github.event.inputs.relay }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 推去 feeds 分支
        working-directory: out
        run: |
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json econ.json $(ls serenity_recent.json trump_recent.json btc.json fng.json hyper.json rates.json commod.json walert.json earnings.json macro_src.json 2>/dev/null)
          git commit -q -m "feeds $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" feeds
      - name: 接力：開始後約 5 分鐘再觸發自己（2026-10-03 起；2026-10-06：已經有另一個接力／手動排緊隊或者行緊就唔觸發，保持得一條鏈；排程嘅唔計，因為接力鏈仲行緊佢會自己跳過）
        if: always()
        continue-on-error: true
        run: |
          el=$(( $(date +%s) - T0 ))
          if [ "$el" -lt 270 ]; then sleep $(( 270 - el )); fi
          other=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/feeds.yml/runs?per_page=20" | python3 -c "import json,sys;d=json.load(sys.stdin);print(sum(1 for r in d.get('workflow_runs',[]) if r['status'] in ('queued','in_progress','waiting','pending') and r['event'] != 'schedule' and r['id'] != ${{ github.run_id }}))" || echo 0)
          if [ "$other" -gt 0 ]; then echo "已經有 $other 個 feeds 排緊隊／行緊，唔再觸發"; exit 0; fi
          curl -sf -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/feeds.yml/dispatches" -d '{"ref":"main","inputs":{"relay":"1"}}' && echo "已觸發下一次"
