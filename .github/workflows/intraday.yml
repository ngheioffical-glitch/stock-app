name: 盤中 5 分鐘掃描（測試）
# 美股開市期間每 5 分鐘：Yahoo 5 分鐘 K，候選股收市企穩前高就記低；推去 live 分支（每次覆蓋）
# 13:00–21:59 UTC 包晒夏令（13:30–20:00）同冬令（14:30–21:00）；唔喺開市時間程式會自己跳過
on:
  schedule:
    - cron: "4,19,34,49 13-21 * * 1-5"   # 2026-10-14：避開整點；2026-10-06 慳運算：開市時間每 15 分鐘
  workflow_dispatch:
permissions:
  contents: write
# 2026-10-06：唔用 concurrency（GitHub 遲／故障時排隊嘅會被取消，用戶收到好多「cancelled」電郵）；每次只跑 1 分鐘，唔會疊
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 攞上次結果（同日嘅掃描紀錄要接落去）
        run: |
          git fetch -q --depth 1 origin live && git show FETCH_HEAD:intraday.json > prev.json || echo "{}" > prev.json
      - run: python scanner/intraday.py out prev.json
        env:
          PYTHONIOENCODING: utf-8
      - name: 推去 live 分支
        working-directory: out
        run: |
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday.json
          git commit -q -m "intraday $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
