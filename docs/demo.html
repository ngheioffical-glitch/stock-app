<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>龍頭突破 示範</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F0E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&family=Noto+Serif+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--k:1;--sans:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif HK","Songti TC","PMingLiU",serif;--num:Inter,"Noto Sans HK",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
  --s-press:var(--ease);--d-press:320ms;--s-dock:var(--ease);--d-dock:420ms;--s-pop:var(--ease);--d-pop:380ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#191815;color:#E8E3D8;font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
small{font-size:12px;font-weight:400;color:var(--mut)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.up{color:var(--up)}.dn{color:var(--dn)}.wr{color:var(--warn)}.mut{color:var(--mut)}

/* 展示框（唔係設計嘅一部分） */
.page{display:flex;justify-content:center;align-items:flex-start;gap:30px;padding:20px}
.panel{flex:0 1 350px;min-width:0;max-height:calc(100dvh - 40px);overflow-y:auto;scrollbar-width:thin;font-size:13px;line-height:1.55;color:#B8B2A5}
.panel h2{font:900 21px/1.3 var(--serif);color:#F1EBDD}
.panel p{margin-top:6px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tg button{min-height:38px;padding:0 12px;border:1px solid #3B3830;border-radius:10px;font-weight:700;color:#D8D2C4}
.tg button[aria-pressed=true]{background:#F1EBDD;border-color:#F1EBDD;color:#191815}
.dl{border-top:1px solid #33302A}
.dl li{display:grid;grid-template-columns:1fr 44px;gap:0 10px;align-items:start;padding:10px 0;border-bottom:1px solid #33302A}
.dl b{display:block;color:#F1EBDD;font-size:14px}
.dl em{display:block;margin-top:2px;font-style:normal;font-size:12px;color:#9F998B}
.panel a{color:#9BD3E2;text-underline-offset:2px}
.dl button{grid-row:1/4;grid-column:2;min-height:36px;border-radius:9px;background:#2B2822;color:#F1EBDD;font-weight:700;text-align:center}
.pnote{margin-top:10px;font-size:12px;color:#8F897B}
.page :focus-visible{outline:2px solid #7DD3E8;outline-offset:2px}

/* 手機 */
.phone{position:relative;flex:none;width:390px;height:min(844px,calc(100dvh - 40px));min-height:600px;overflow:hidden;border-radius:44px;background:#000;color:var(--ink);isolation:isolate;box-shadow:0 0 0 9px #0C0B09,0 0 0 10px #3B3830,0 24px 60px rgba(0,0,0,.5);--sat:30px;--ir:44px;
  -webkit-user-select:none;user-select:none;line-break:strict;text-spacing-trim:trim-start;font-kerning:normal}
.phone[data-theme=day]{color-scheme:light;--bg:#F5F0E6;--card:#FBF8F1;--card2:#EAE3D4;--line:#DED6C5;--line2:#BDB5A4;--ink:#1C1A15;--ink2:#3B382F;--mut:#6A6458;--up:#02523B;--dn:#901308;--warn:#7E620D;--wash:rgba(28,26,21,.07);
  --dock:#1C1A15;--dock-ink:#BDB6A6;--dock-on:#1C1A15;--dock-pill:#F5F0E6;--sheet:#FBF8F1;--backdrop:rgba(20,18,14,.45);--tbbg:rgba(245,240,230,.82);--tip:#1C1A15;--tip-i:#F5F0E6;--l1:#1C1A15;--l2:#6A6458;--shadow:rgba(40,34,20,.26);
  --c1:#6B4CAE;--c2:#2695AC;--c3:#BB731B;--c4:#3B434D;--pl:#E8E1F2;--pl-i:#2F2170;--pt:#DCEBEA;--pt-i:#0B4A5C;--pd:#F3E3CB;--pd-i:#5F3A08;--px:#E5E1D8;--px-i:#2B323A;--okfg:#F5F0E6}
.phone[data-theme=night]{color-scheme:dark;--bg:#151310;--card:#201D18;--card2:#2F2B24;--line:#38332B;--line2:#5C554A;--ink:#EDE6D8;--ink2:#D5CEBF;--mut:#A59D8D;--up:#8BE0B4;--dn:#FF8A8A;--warn:#F3C26D;--wash:rgba(237,230,216,.08);
  --dock:#2F2B24;--dock-ink:#B9B1A1;--dock-on:#151310;--dock-pill:#EDE6D8;--sheet:#201D18;--backdrop:rgba(0,0,0,.58);--tbbg:rgba(21,19,16,.8);--tip:#EDE6D8;--tip-i:#151310;--l1:#EDE6D8;--l2:#A59D8D;--shadow:rgba(0,0,0,.5);
  --c1:#7C5EC2;--c2:#3FA8BF;--c3:#BB731B;--c4:#DBE6F2;--pl:#2A2438;--pl-i:#D9CFF3;--pt:#1C2F31;--pt-i:#BDE3E8;--pd:#33291A;--pd-i:#F0D6AE;--px:#2A2823;--px-i:#DDD8CC;--okfg:#151310}
.phone :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.stack{position:absolute;inset:0;overflow:hidden;background:var(--bg);border-radius:var(--ir)}
.stack.carded{border-radius:max(var(--ir),12px)}
#main{position:absolute;inset:0}
.phone.no-tr *,.phone.no-tr *::before,.phone.no-tr *::after{transition:none!important}
.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:none;visibility:hidden;background:var(--bg);touch-action:pan-y pinch-zoom}
.views.pg .view.on{will-change:transform}
.view::-webkit-scrollbar,.sh-body::-webkit-scrollbar,.seg::-webkit-scrollbar,.push::-webkit-scrollbar,.sr-list::-webkit-scrollbar{display:none}
.view.on{visibility:visible}
.inner{position:relative;z-index:1;min-height:100%;padding:var(--sat) 16px 124px}

/* 撳落去：撳落快、放手彈；scale 只郁合成層 */
[data-p]{transition:transform calc(var(--d-press)*var(--k)) var(--s-press)}
[data-p].is-down{transition:transform calc(80ms*var(--k)) cubic-bezier(.3,0,.2,1)}
[data-p=btn].is-down{transform:scale(.96)}
[data-p=card].is-down{transform:scale(.975)}
[data-p=row].is-down{transform:scale(.985)}
[data-p=ico].is-down{transform:scale(.9)}
[data-p=chk].is-down{transform:scale(.9)}
[data-p=seg].is-down{transform:scale(.95)}
[data-p=row]{position:relative}
[data-p=row]::before{content:"";position:absolute;inset:0 -8px;border-radius:12px;background:var(--wash);opacity:0;transition:opacity calc(260ms*var(--k)) ease-out;pointer-events:none}
[data-p=row].is-down::before{opacity:1;transition-duration:calc(60ms*var(--k))}
[data-p=ico]{position:relative}
[data-p=ico]::before{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--wash);opacity:0;pointer-events:none;transition:opacity calc(240ms*var(--k)) ease-out}
[data-p=ico].is-down::before{opacity:1;transition-duration:calc(60ms*var(--k))}

/* 頂部 */
.tb{position:absolute;z-index:5;top:0;left:0;right:0;height:calc(var(--sat) + 52px);display:flex;align-items:flex-end;padding:0 8px 4px 16px;pointer-events:none}
.tb-bg{position:absolute;inset:0;background:var(--tbbg);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);opacity:0;visibility:hidden}
.tb-title{position:relative;flex:1;font:900 17px/44px var(--serif);opacity:0}
.tb-acts{position:relative;display:flex;gap:2px;pointer-events:auto}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.ico svg{position:relative;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-th{position:relative;display:block;width:21px;height:21px}
.ic-th svg{position:absolute;inset:0;transition:transform calc(420ms*var(--k)) var(--s-pop),opacity calc(180ms*var(--k))}
.phone[data-theme=day] .ic-th .sun,.phone[data-theme=night] .ic-th .moon{opacity:0;transform:rotate(-70deg) scale(.6)}
.lgt{min-height:50px;margin-bottom:10px;transform-origin:0 50%}
.mast{padding:7px 100px 0 0;font:900 30px/1.15 var(--serif);letter-spacing:.02em}
.mast-d{margin-top:4px;font-size:12.5px;color:var(--mut)}
.demo-tag{margin-top:3px;font-size:12px;font-weight:700;color:var(--warn)}

/* 底部 5 格 */
.dock{position:absolute;z-index:6;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));height:62px;display:flex;padding:5px;background:var(--dock);border-radius:24px;box-shadow:0 10px 28px var(--shadow);transform-origin:50% 100%;transition:transform calc(420ms*var(--k)) var(--s-dock)}
.dock.mini{transform:translateY(8px) scale(.93)}
.dock-pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);transform:translateX(calc(var(--i,0)*100%));transition:transform calc(var(--d-dock)*var(--k)) var(--s-dock)}
.dock.pg .dock-pill,.dock.pgd button{transition:none}
.dock-pill i{display:block;height:100%;border-radius:19px;background:var(--dock-pill)}
.dock button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;font-size:12px;font-weight:700;color:var(--dock-ink);transition:color calc(180ms*var(--k)) ease-out}
.dock button[aria-current=page]{color:var(--dock-on)}
.dock .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:translateY(var(--iy,0)) scale(var(--is,1));transition:transform calc(380ms*var(--k)) var(--s-press)}
.dock button.is-down .ic{--is:.88;transition-duration:calc(80ms*var(--k))}
.dock .lb{transition:opacity calc(160ms*var(--k)) ease-out}
.dock.mini .lb{opacity:0}.dock.mini .ic{--iy:8px}

/* 細分頁 */
.seg-wrap{position:sticky;top:calc(var(--sat) + 52px);z-index:3;margin:0 -16px 8px;padding:6px 16px 8px;background:var(--bg)}
.seg{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg-ind{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--ink);transition:transform calc(var(--d-dock)*var(--k)) var(--s-dock),width calc(var(--d-dock)*var(--k)) var(--s-dock)}
.seg button{position:relative;flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--mut);white-space:nowrap;transition:transform calc(var(--d-press)*var(--k)) var(--s-press),color calc(180ms*var(--k)) ease-out}
.seg button[aria-selected=true]{color:var(--bg)}
.seg-s{margin-top:10px;padding:0;background:var(--card2);border-radius:999px}
.seg-s button{flex:1;min-height:34px;padding:0;font-size:12.5px;text-align:center}
.seg-s button::after{content:"";position:absolute;inset:-5px 0}
.pane{min-height:58vh}

/* 內容 */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 10px;font:900 20px/1.3 var(--serif)}
.sec small{font-family:var(--sans);white-space:nowrap}
.head{margin-bottom:18px}
.head button{display:block;width:100%}
.head-t{display:block;font:900 30px/1.26 var(--serif);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.head-t .num{font-weight:800;letter-spacing:-.01em}
.head-d{display:block;margin-top:8px;font:500 15px/1.75 var(--serif);color:var(--ink2);text-wrap:pretty}
.head-m{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--warn)}

.todo{padding:14px 16px 8px}
.todo-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;font-size:16px;font-weight:900}
.todo-c{display:inline-block;font-size:12.5px;font-weight:500;color:var(--mut)}
.todo.alldone .todo-c{color:var(--up);font-weight:700}
.it{display:flex;align-items:center;gap:2px;margin-left:-8px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.chk{flex:none;align-self:stretch;display:grid;place-items:center;width:44px;min-height:48px}
.chk svg{width:28px;height:28px;overflow:visible}
.chk .o{fill:none;stroke:var(--line2);stroke-width:1.75}
.chk .f{fill:var(--up);transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform calc(var(--d-pop)*var(--k)) var(--s-pop)}
.chk .t{fill:none;stroke:var(--okfg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset calc(200ms*var(--k)) ease-out}
.it.done .f{transform:scale(1)}
.it.done .t{stroke-dashoffset:0;transition-delay:calc(90ms*var(--k))}
.it-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 2px 8px 2px}
.it .m{flex:1;min-width:0}
.it .m>b{display:block;font-size:15.5px}
.it .m small{display:block;margin-top:1px;transition:opacity calc(240ms*var(--k))}
.strike{background:linear-gradient(currentColor,currentColor) 0 56%/0 1.5px no-repeat;transition:background-size calc(300ms*var(--k)) var(--ease),color calc(240ms*var(--k))}
.it.done .strike{background-size:100% 1.5px;color:var(--mut)}
.it.done .m small{opacity:.6}
.it .r{flex:none;font-weight:700;text-align:right;white-space:nowrap}
.it .r small{display:block;font-family:var(--sans)}
.note{margin:2px 0 6px;font-size:12.5px;line-height:1.6;color:var(--mut)}
.todo-empty{padding:12px 0 10px;text-align:center}
.todo-empty b{display:block;font:900 18px/1.4 var(--serif)}
.todo-empty small{display:block;margin-top:2px;font-size:13px}

.acct{margin-top:12px;padding:16px 16px 12px}
.acct-lab{display:block;min-height:18px;font-size:12.5px;color:var(--mut)}
.hero{display:block;margin:1px 0 8px;font-size:46px;font-weight:800;line-height:1.08;letter-spacing:-.025em}
.row3{display:flex;gap:20px;margin-bottom:10px;font-size:12px;color:var(--mut)}
.row3 b{display:block;font-size:15px;font-weight:700}
.scrub{position:relative;height:128px;color:var(--up);touch-action:pan-y;cursor:crosshair;transition:color calc(260ms*var(--k))}
.scrub.neg{color:var(--dn)}
.scrub svg{display:block;width:100%;overflow:visible}
.scrub .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrub .base{opacity:0;transition:opacity calc(160ms*var(--k))}
.scrub.on .base{opacity:.28}
.scrub .zero{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
.scrub .cross{stroke:var(--mut);stroke-width:1;opacity:0}
.scrub .pt{fill:currentColor;stroke:var(--card);stroke-width:2;opacity:0}
.scrub.on .cross,.scrub.on .pt{opacity:1}

.alloc{display:flex;gap:2px;height:14px;margin:2px 0 12px}
.alloc i{display:block;min-width:4px;border-radius:2px}
.alloc i:first-child{border-radius:7px 2px 2px 7px}.alloc i:last-child{border-radius:2px 7px 7px 2px}
.leg-lead{background:var(--c1)}.leg-trend{background:var(--c2)}.leg-dip{background:var(--c3)}.leg-xr{background:var(--c4)}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{display:block;min-height:136px;padding:14px;border-radius:20px;font-size:12.5px;line-height:1.5}
.pot-n{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%}
.pot-v{display:block;margin:2px 0 5px;font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.pot-l{display:block}
.pot-lead{background:var(--pl);color:var(--pl-i)}.pot-trend{background:var(--pt);color:var(--pt-i)}.pot-dip{background:var(--pd);color:var(--pd-i)}.pot-xr{background:var(--px);color:var(--px-i)}

.news li{border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.news button{display:grid;grid-template-columns:30px 1fr;gap:4px;width:100%;padding:12px 0;font:500 15.5px/1.72 var(--serif);text-wrap:pretty}
.news i{font:900 22px/1.25 var(--serif)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 div{min-width:0}
.g4 span{display:block;font-size:12px;color:var(--mut)}
.g4 b{display:block;font-family:var(--num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.g4 small{display:block}

.hr{display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:9px 0;border-top:1px solid var(--line)}
.hr.first,.hr:first-child{border-top:0}
.hr .sw{flex:none;width:6px;height:30px;border-radius:3px}
.hr .m{flex:1;min-width:0}
.hr .m b{display:block;font-size:15.5px;font-weight:700}
.hr .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .r{text-align:right;font-size:14.5px;font-weight:700;white-space:nowrap}
.hr .r small{display:block;font-weight:400}
.sr{display:grid;grid-template-columns:minmax(0,1fr) 66px 92px;gap:8px;align-items:center;width:100%;min-height:62px;padding:8px 0;border-top:1px solid var(--line)}
.sr:first-child{border-top:0}
.sr b{display:block;font-size:15.5px}
.sr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .rr{text-align:right;font-size:14px;font-weight:700}
.sr .rr small{font-weight:400;font-family:var(--sans)}
.spark{display:block;width:66px;height:26px;fill:none;stroke:var(--mut);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.more-b{display:block;width:100%;min-height:44px;margin-top:6px;border-radius:12px;background:var(--card2);font-size:13.5px;font-weight:700;text-align:center}
.ph{padding:44px 20px;text-align:center;color:var(--mut)}
.ph b{display:block;margin-bottom:4px;font:900 20px var(--serif);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:500;color:var(--mut);text-align:right;padding:0 0 7px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{padding:9px 0 9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ai li{padding:11px 0;border-top:1px solid var(--line);font:500 15.5px/1.72 var(--serif);text-wrap:pretty}
.ai li:first-child{border-top:0;padding-top:0}

/* 展開卡 */
.leg{border-top:1px solid var(--line)}
.leg-h{display:grid;grid-template-columns:8px 1fr auto 18px;align-items:center;gap:10px;width:100%;min-height:52px}
.leg-h b{font-size:15px}
.leg-h .pc{font-weight:700;font-size:14.5px}
.chev{width:16px;height:16px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform calc(220ms*var(--k)) var(--ease)}
.leg.open .chev{transform:rotate(90deg)}
.leg-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(260ms*var(--k)) var(--ease)}
.leg.open .leg-b{grid-template-rows:1fr}
.leg-i{min-height:0;overflow:hidden;opacity:0;transition:opacity calc(160ms*var(--k)) ease-out}
.leg.open .leg-i{opacity:1;transition-duration:calc(280ms*var(--k));transition-delay:calc(60ms*var(--k))}
.leg-i p{padding:0 0 10px 18px;font-size:13px;color:var(--mut)}

/* 圖 */
.ch{position:relative;touch-action:pan-y;cursor:crosshair}
.ch svg{display:block;width:100%;overflow:visible}
.ch text{font:11.5px var(--num);fill:var(--mut);font-size:12px}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch .cross{stroke:var(--mut);stroke-width:1;opacity:0}
.ch .pt{opacity:0;stroke:var(--card);stroke-width:2}
.ch .tip{position:absolute;top:0;padding:5px 8px;border-radius:8px;background:var(--tip);color:var(--tip-i);font-size:12px;line-height:1.45;white-space:nowrap;pointer-events:none;opacity:0}
.ch.on .cross,.ch.on .pt,.ch.on .tip{opacity:1}

  try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(h[0]);}catch(e){}
  hapt.textContent="震："+h[1];
  hapt.getAnimations().forEach(a=>a.cancel());
  hapt.animate([{opacity:0,transform:"scale(.8)"},{opacity:1,transform:"scale(1)",offset:.15},{opacity:1,transform:"scale(1)",offset:.7},{opacity:0,transform:"scale(.96)"}],{duration:520*K});
}
// 手指 + 滑鼠共用：touchmove 可以 preventDefault，由手勢接手碌動
let lastTouch=0;
function bindDrag(el,h){
  let st=null;
  const begin=(x,y,e)=>{if(h.start&&h.start(x,y,e)===false)return false;st={x0:x,y0:y,x,y,t:performance.now(),vx:0,vy:0};return true;};
  const step=(x,y,e)=>{const t=performance.now(),dt=Math.max(1,t-st.t);st.vx=.7*(x-st.x)/dt+.3*st.vx;st.vy=.7*(y-st.y)/dt+.3*st.vy;st.x=x;st.y=y;st.t=t;h.move(x-st.x0,y-st.y0,e);};
  const fin=e=>{if(!st)return;const s=st;st=null;const idle=performance.now()-s.t>90;h.end(idle?0:s.vx*1000,idle?0:s.vy*1000,e);};
  el.addEventListener("mousedown",e=>{
    if(e.button||performance.now()-lastTouch<700)return;
    if(!begin(e.clientX,e.clientY,e))return;
    const mm=ev=>{if(st)step(ev.clientX,ev.clientY,ev);},mu=ev=>{removeEventListener("mousemove",mm);removeEventListener("mouseup",mu);fin(ev);};
    addEventListener("mousemove",mm);addEventListener("mouseup",mu);
  });
  el.addEventListener("touchstart",e=>{lastTouch=performance.now();if(e.touches.length>1){fin(e);return;}begin(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:true}); // 第二隻手指：完結手勢，唔好留低拖到一半
  el.addEventListener("touchmove",e=>{if(st)step(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
  el.addEventListener("touchend",e=>{lastTouch=performance.now();fin(e);});
  el.addEventListener("touchcancel",e=>{lastTouch=performance.now();fin(e);});
}

let PR=null;
function prDown(){if(PR&&!PR.down){PR.down=true;PR.t=performance.now();PR.el.classList.add("is-down");}}
function prCancel(){if(!PR)return;clearTimeout(PR.timer);PR.el.classList.remove("is-down");PR=null;}
phone.addEventListener("pointerdown",e=>{
  const el=e.target.closest("[data-p]");if(!el||e.button)return;
  prCancel();
  const inScroll=!!el.closest(".view,.sh-body,.push,.sr-list")&&e.pointerType!=="mouse";
  PR={el,x:e.clientX,y:e.clientY,down:false,t:0,timer:0};
  if(inScroll)PR.timer=setTimeout(prDown,45);else prDown(); // 碌動區入面等 45 毫秒，分清撳定碌
},true);
addEventListener("pointermove",e=>{if(PR&&Math.hypot(e.clientX-PR.x,e.clientY-PR.y)>8)prCancel();},{passive:true});
addEventListener("pointerup",()=>{
  if(!PR)return;const p=PR;PR=null;clearTimeout(p.timer);
  if(!p.down){p.el.classList.add("is-down");setTimeout(()=>p.el.classList.remove("is-down"),T(80));return;} // 太快都要見到
  const left=T(70)-(performance.now()-p.t);

});

const CHARTS=new Map();let chartId=0;
function chart(series,opt={}){
  const id="c"+(++chartId);CHARTS.set(id,{series,...opt});
  const lg=series.length>1?`<div class="lg-row">${series.map(s=>`<span><i class="${s.dash?"dash":""}" style="--lc:${s.color}"></i>${s.name} <b class="num">${s.last}</b></span>`).join("")}</div>`:"";
  return `${lg}<div class="ch" data-ch="${id}" style="height:${opt.h||120}px" role="img" aria-label="${opt.alt||""}"></div>`;
}
function ticks(lo,hi,n=3){const raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,step=(m<1.5?1:m<3?2:m<7?5:10)*p;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)out.push(+v.toFixed(6));return out;}
function drawCharts(root){
  root.querySelectorAll(".ch[data-ch]").forEach(el=>{
    const c=CHARTS.get(el.dataset.ch);if(!c)return;
    const W=el.clientWidth||320,H=c.h||120,P={t:8,r:c.noaxis?4:48,b:c.noaxis?4:20,l:2};
    const all=c.series.flatMap(s=>s.v.filter(x=>x!=null));
    let lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
    const N=c.series[0].v.length,X=i=>P.l+i/(N-1)*(W-P.l-P.r),Y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
    const path=s=>{let d="",pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;});return d;};
    const f=c.fmt||(v=>n0(v));
    const grid=c.noaxis?"":ticks(lo,hi).map(v=>`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${W}" y="${Y(v)+4}" text-anchor="end">${f(v)}</text>`).join("");
    const xlab=c.noaxis||!c.d?"":`<text x="${P.l}" y="${H-4}">${c.d[0].slice(2)}</text><text x="${W-P.r}" y="${H-4}" text-anchor="end">${c.d[N-1].slice(2)}</text>`;
    el.innerHTML=`<svg height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${grid}${xlab}<g class="lines">${c.series.map(s=>`<path class="ln" d="${path(s)}" stroke="${s.color}" ${s.dash?'stroke-dasharray="4 4"':""}/>`).join("")}</g><line class="cross" y1="${P.t}" y2="${H-P.b}"/>${c.series.map(s=>`<circle class="pt" r="4.5" fill="${s.color}"/>`).join("")}</svg><div class="tip"></div>`;
    anim(el.querySelector(".lines"),[{clipPath:`inset(-10px ${W}px -10px 0)`},{clipPath:"inset(-10px 0px -10px 0)"}],{d:620});
    const cross=el.querySelector(".cross"),pts=[...el.querySelectorAll(".pt")],tip=el.querySelector(".tip");
    const move=e=>{
      const r=el.getBoundingClientRect(),k=clamp(Math.round((e.clientX-r.left)/r.width*W/(W-P.l-P.r)*(N-1)),0,N-1),x=X(k);
      cross.setAttribute("x1",x);cross.setAttribute("x2",x);
      c.series.forEach((s,j)=>{const v=s.v[k];pts[j].style.display=v==null?"none":"";if(v!=null){pts[j].setAttribute("cx",x);pts[j].setAttribute("cy",Y(v));}});
      tip.innerHTML=(c.d?`<b>${c.d[k]}</b><br>`:"")+c.series.filter(s=>s.v[k]!=null).map(s=>`${c.series.length>1?s.name+" ":""}${f(s.v[k])}`).join("<br>");

}

const NP=D.nav.v.length;
const YI=D.nav.d.findIndex(d=>d>=D.asof.slice(0,4)+"-01-01");
const RANGES=[{l:"1 個月",n:22,lab:"近 1 個月"},{l:"3 個月",n:64,lab:"近 3 個月"},{l:"今年",n:NP-YI+1,lab:"今年"},{l:"1 年",n:NP,lab:"近 1 年"}];
const A={i:2,H:128,t:8,b:6};
const acctSeries=i=>{const n=RANGES[i].n,v=D.nav.v.slice(-n);return {d:D.nav.d.slice(-n),v:v.map(x=>x/v[0]-1)};};
const resample=v=>{const o=[];for(let i=0;i<NP;i++){const f=i/(NP-1)*(v.length-1),a=Math.floor(f),b=Math.min(v.length-1,a+1);o.push(v[a]+(v[b]-v[a])*(f-a));}return o;};
const scaleOf=v=>{const lo=Math.min(0,...v),hi=Math.max(0,...v),p=(hi-lo)*.08||.01;return {lo:lo-p,hi:hi+p};};
const yOf=(x,s)=>A.t+(s.hi-x)/(s.hi-s.lo)*(A.H-A.t-A.b);
function acctPaint(){
  let d="";A.ys.forEach((y,i)=>{d+=(i?"L":"M")+(i/(NP-1)*A.W).toFixed(1)+" "+y.toFixed(1);});
  A.lnB.setAttribute("d",d);A.ln.setAttribute("d",d);A.ar.setAttribute("d",d+`L${A.W} ${A.H}L0 ${A.H}Z`);
  A.z.setAttribute("y1",A.zero);A.z.setAttribute("y2",A.zero);
}
function heroSet(x){A.num.textContent=sg(x);A.num.classList.toggle("up",x>=0);A.num.classList.toggle("dn",x<0);}
function initAcct(v){
  const el=v.querySelector("#scrub");A.el=el;A.num=v.querySelector("#acctNum");A.lab=v.querySelector("#acctLab");A.seg=v.querySelector("#rng");
  A.W=el.clientWidth;
  el.innerHTML=`<svg height="${A.H}" viewBox="0 0 ${A.W} ${A.H}" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient><clipPath id="cw"><rect id="cwR" x="-4" y="-12" width="${A.W+8}" height="${A.H+24}"/></clipPath></defs><line class="zero" x1="0" x2="${A.W}"/><path class="ln base"/><g clip-path="url(#cw)"><path class="ar" fill="url(#ag)"/><path class="ln bright"/></g><line class="cross" y1="${A.t}" y2="${A.H-A.b}"/><circle class="pt" r="5"/></svg>`;
  A.lnB=el.querySelector(".base");A.ln=el.querySelector(".bright");A.ar=el.querySelector(".ar");A.z=el.querySelector(".zero");A.cross=el.querySelector(".cross");A.pt=el.querySelector(".pt");A.clip=el.querySelector("#cwR");
  A.s=acctSeries(A.i);A.sc=scaleOf(A.s.v);A.ys=resample(A.s.v).map(x=>yOf(x,A.sc));A.zero=yOf(0,A.sc);acctPaint();
  el.classList.toggle("neg",A.s.v.at(-1)<0);
  const at=cx=>{
    const r=el.getBoundingClientRect(),N=A.s.v.length,k=Math.round(clamp((cx-r.left)/r.width,0,1)*(N-1)),x=k/(N-1)*A.W,val=A.s.v[k];
    A.cross.setAttribute("x1",x);A.cross.setAttribute("x2",x);A.pt.setAttribute("cx",x);A.pt.setAttribute("cy",yOf(val,A.sc));A.clip.setAttribute("width",x+4);
    heroSet(val);A.lab.textContent=A.s.d[k];
    const m=A.s.d[k].slice(0,7);if(A.m&&m!==A.m)buzz("tick");A.m=m;
    el.classList.add("on");
  };
  const end=()=>{if(!el.classList.contains("on"))return;el.classList.remove("on");A.m=null;A.clip.setAttribute("width",A.W+8);heroSet(A.s.v.at(-1));A.lab.textContent="模型帳戶 · "+RANGES[A.i].lab;anim(A.num,[{opacity:.4,transform:"translateY(3px)"},{opacity:1,transform:"none"}],{d:SP.press.ms,e:SP.press.e});};
  A.scrubAt=at;A.scrubEnd=end;
  el.addEventListener("pointerdown",e=>{at(e.clientX);buzz("light");if(e.pointerType!=="touch")noClickUntil=0;});
  el.addEventListener("pointermove",e=>at(e.clientX));
  el.addEventListener("pointerup",e=>{if(e.pointerType==="touch")end();});
  el.addEventListener("pointerleave",end);el.addEventListener("pointercancel",end);
  moveInd(A.seg,true,A.seg.querySelector("[aria-selected=true]"));
}
function acctDrawOn(dl=0){
  if(RM||!A.clip)return;
  A.clip.setAttribute("width",0);const t0=performance.now()+T(dl);
  const f=now=>{const p=clamp((now-t0)/T(780),0,1),e=1-Math.pow(1-p,3);A.clip.setAttribute("width",e*(A.W+8));if(p<1)requestAnimationFrame(f);};
  requestAnimationFrame(f);
}
function setRange(i){
  if(i===A.i)return;
  A.stop&&A.stop();
  const y0=A.ys.slice(),z0=A.zero,r0=A.s.v.at(-1);
  A.i=i;A.s=acctSeries(i);A.sc=scaleOf(A.s.v);
  const y1=resample(A.s.v).map(x=>yOf(x,A.sc)),z1=yOf(0,A.sc),r1=A.s.v.at(-1);
  A.lab.textContent="模型帳戶 · "+RANGES[i].lab;A.el.classList.toggle("neg",r1<0);
  A.seg.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",j===i));
  moveInd(A.seg,false,A.seg.querySelector("[aria-selected=true]"));
  buzz("tick");
  A.stop=spring({from:0,to:1,k:230,c:27,tol:.002,on:p=>{A.ys=y0.map((y,j)=>lerp(y,y1[j],p));A.zero=lerp(z0,z1,p);acctPaint();heroSet(lerp(r0,r1,clamp(p,0,1)));},done:()=>{heroSet(r1);}});
}

const VIEWS={};let cur="today";
const ORDER=NAVS.map(n=>n[0]);
function view(tab){
  if(VIEWS[tab])return VIEWS[tab];
  const v=document.createElement("section");v.className="view";v.dataset.view=tab;v.setAttribute("aria-label",NAVS.find(n=>n[0]===tab)[1]);
  v.innerHTML=`<div class="ptr" aria-hidden="true"><svg viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="11"/><circle class="fg" pathLength="1" cx="15" cy="15" r="11"/><path class="ok" pathLength="1" d="M9.5 15.5l4 4 7-8"/></svg></div>`+(tab==="today"?todayHTML():tabHTML(tab));
  viewsEl.appendChild(v);VIEWS[tab]=v;
  v.addEventListener("scroll",()=>onScroll(v),{passive:true});
  bindPTR(v);
  if(tab==="today")initAcct(v);
  drawCharts(v);
  v.querySelectorAll(".evch").forEach(el=>{evDraw(el);evReveal(el);});
  v.querySelectorAll(".seg").forEach(s=>moveInd(s,true));
  return v;
}
function setDock(tab){
  const i=ORDER.indexOf(tab),pill=dock.querySelector(".dock-pill");
  pill.style.setProperty("--i",i);
  dock.querySelectorAll("button").forEach(b=>{b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current");});
}
function go(tab){
  pgAbort();
  if(tab===cur){
    const v=view(tab);
    if(v.scrollTop>0)v.scrollTo({top:0,behavior:RM?"auto":"smooth"});
    else anim(dock.querySelector(".dock-pill i"),[{transform:"scale(1)"},{transform:"scale(1.07,.93)",offset:.3},{transform:"scale(1)"}],{d:300});
    buzz("tick");return;
  }
  const from=view(cur),to=view(tab),dir=ORDER.indexOf(tab)>ORDER.indexOf(cur)?1:-1,first=!to._seen;
  to._seen=true;cur=tab;
  Object.values(VIEWS).forEach(v=>{v.getAnimations().forEach(a=>a.cancel());if(v!==from&&v!==to)v.classList.remove("on");});
  to.classList.add("on");
  to.style.zIndex=2;from.style.zIndex=1;
  anim(from,[{opacity:1,transform:"none"},{opacity:0,transform:`translateX(${-dir*10}px)`}],{d:80,e:"ease-in"}).onfinish=()=>{if(cur!==from.dataset.view)from.classList.remove("on");};
  anim(to,[{opacity:0,transform:`translateX(${dir*14}px)`},{opacity:1,transform:"none"}],{d:200,dl:30,f:"backwards"});

const TOASTC={life:4000,swipe:45,out:200}; // sonner src/index.tsx：留 4 秒，掃 45px 就走，200 毫秒消失
function toast(msg){
  toastsEl.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  toastsEl.appendChild(t);
  anim(t,[{opacity:0,transform:"translateY(26px) scale(.94)"},{opacity:1,transform:"none"}],{d:SP.press.ms,e:SP.press.e});
  let timer,gone=false,dxNow=0;
  const out=(x=0)=>{if(gone)return;gone=true;clearTimeout(timer);anim(t,[{opacity:1,transform:`translateX(${x}px)`},{opacity:0,transform:x?`translateX(${x>0?260:-260}px)`:"translateY(12px) scale(.97)"}],{d:TOASTC.out,e:"ease-in",f:"forwards"}).onfinish=()=>t.remove();};
  const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>out(),T(TOASTC.life));};arm();
  bindDrag(t,{start:()=>{clearTimeout(timer);return true;},move:(dx,dy,e)=>{dxNow=dx;if(e.cancelable)e.preventDefault();t.style.transform=`translateX(${dx}px)`;t.style.opacity=1-Math.min(1,Math.abs(dx)/220);},end:()=>{if(Math.abs(dxNow)>=TOASTC.swipe){noClickUntil=performance.now()+300;out(dxNow);}else{t.style.transform="";t.style.opacity="";anim(t,[{transform:`translateX(${dxNow}px)`},{transform:"none"}],{d:SP.press.ms,e:SP.press.e});arm();}dxNow=0;}});
}

  <p class="pnote">內容係 ${D.asof} 收市嘅真實快照，冇連數據。買幾多股用假設本金 US$100,000；帳戶曲線係 app 而家嘅模型帳戶。其他功能冇改，交易規則冇改。電腦冇震動，所以手機頂會閃「震」字提你。</p>`;
  $("#panel").addEventListener("click",e=>{
    const b=e.target.closest("[data-try]");if(b)return TRY[b.dataset.try]();
    if(e.target.id==="tgSlow"){K=K>1?1:4;document.documentElement.style.setProperty("--k",K);syncPanel();}
    if(e.target.id==="tgNight")TRY.theme();
    if(e.target.id==="tgRm"){RM=!RM;RM?phone.setAttribute("data-rm",""):phone.removeAttribute("data-rm");syncPanel();}
  });
  syncPanel();
}

dock.innerHTML=`<span class="dock-pill"><i></i></span>`+NAVS.map(([k,l,p])=>`<button data-tab="${k}" data-p="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg><span class="lb">${l}</span></button>`).join("");
if(new URLSearchParams(location.search).get("theme")==="night")setTheme("night");
const today=view("today");today.classList.add("on");today._seen=true;setDock("today");paintBar(today);
initPanel();
if(RM)phone.setAttribute("data-rm","");
if(new URLSearchParams(location.search).get("nosplash")==null)launch();
// 有空閒就預先砌好其他分頁，第一次撳先唔會卡一格
{const idle=window.requestIdleCallback||(f=>setTimeout(f,300));(function pre(i){if(i<ORDER.length)idle(()=>{view(ORDER[i]);pre(i+1);});})(0);}
const relayout=()=>{pgAbort();pushEl.querySelectorAll(".evch").forEach(evDraw);Object.values(VIEWS).forEach(v=>{v.querySelectorAll(".seg").forEach(s=>moveInd(s,true));drawCharts(v);v.querySelectorAll(".evch").forEach(evDraw);});if(A.el&&A.el.clientWidth!==A.W){const v=VIEWS.today;A.W=A.el.clientWidth;const i=A.i;initAcctRe(v,i);}};
function initAcctRe(v,i){A.i=i;const old=A.el;const fresh=old.cloneNode(false);old.replaceWith(fresh);initAcct(v);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{Object.values(VIEWS).forEach(v=>v.querySelectorAll(".seg").forEach(s=>moveInd(s,true)));});
let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(relayout,160);});
