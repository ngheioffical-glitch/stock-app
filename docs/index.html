<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>龍頭突破</title>
<!-- 呢個檔（docs/index.html）係 app-src/build.py 砌出嚟：唔好直接改。介面改 app-src/shell.html，功能改 app-src/engine.html，再行 build.py -->
<meta name="theme-color" content="#F5F0E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&family=Noto+Serif+HK:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--k:1;--sans:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif HK","Songti TC","PMingLiU",serif;--num:Inter,"Noto Sans HK",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
  --s-press:var(--ease);--d-press:320ms;--s-dock:var(--ease);--d-dock:420ms;--s-pop:var(--ease);--d-pop:380ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#191815;color:#E8E3D8;font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
small{font-size:12px;font-weight:400;color:var(--mut)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.up{color:var(--up)}.dn{color:var(--dn)}.wr{color:var(--warn)}.mut{color:var(--mut)}

/* 外框：手機全畫面；平板、電腦就喺中間一條直欄 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.page{display:flex;justify-content:center;height:100%}
.page :focus-visible{outline:2px solid #7DD3E8;outline-offset:2px}

/* app */
.phone{position:relative;flex:none;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:#000;color:var(--ink);isolation:isolate;transform:translateZ(0);--sat:max(env(safe-area-inset-top),8px);--ir:0px;
  -webkit-user-select:none;user-select:none;line-break:strict;text-spacing-trim:trim-start;font-kerning:normal}
.phone[data-theme=day]{color-scheme:light;--bg:#F5F0E6;--card:#FBF8F1;--card2:#EAE3D4;--line:#DED6C5;--line2:#BDB5A4;--ink:#1C1A15;--ink2:#3B382F;--mut:#6A6458;--up:#02523B;--dn:#901308;--warn:#7E620D;--warn-ink:#634C07;--wash:rgba(28,26,21,.07);
  --dock:#1C1A15;--dock-ink:#BDB6A6;--dock-on:#1C1A15;--dock-pill:#F5F0E6;--sheet:#FBF8F1;--backdrop:rgba(20,18,14,.45);--tbbg:rgba(245,240,230,.82);--tip:#1C1A15;--tip-i:#F5F0E6;--l1:#1C1A15;--l2:#6A6458;--shadow:rgba(40,34,20,.26);
  --c1:#6B4CAE;--c2:#2695AC;--c3:#BB731B;--c4:#3B434D;--pl:#E8E1F2;--pl-i:#2F2170;--pt:#DCEBEA;--pt-i:#0B4A5C;--pd:#F3E3CB;--pd-i:#5F3A08;--px:#E5E1D8;--px-i:#2B323A;--okfg:#F5F0E6;
  --acc:#0B5A6E;--acc-soft:rgba(11,90,110,.1);--acc-line:rgba(11,90,110,.35);--ora:#8F4510;--ora-soft:rgba(143,69,16,.1);--pur:#553A9E;--pur-soft:rgba(85,58,158,.09);--up-soft:rgba(2,82,59,.09);--dn-soft:rgba(144,19,8,.08);--warn-soft:rgba(126,98,13,.11)}
.phone[data-theme=night]{color-scheme:dark;--bg:#151310;--card:#201D18;--card2:#2F2B24;--line:#38332B;--line2:#5C554A;--ink:#EDE6D8;--ink2:#D5CEBF;--mut:#A59D8D;--up:#8BE0B4;--dn:#FF8A8A;--warn:#F3C26D;--warn-ink:#F3C26D;--wash:rgba(237,230,216,.08);
  --dock:#2F2B24;--dock-ink:#B9B1A1;--dock-on:#151310;--dock-pill:#EDE6D8;--sheet:#201D18;--backdrop:rgba(0,0,0,.58);--tbbg:rgba(21,19,16,.8);--tip:#EDE6D8;--tip-i:#151310;--l1:#EDE6D8;--l2:#A59D8D;--shadow:rgba(0,0,0,.5);
  --c1:#7C5EC2;--c2:#3FA8BF;--c3:#BB731B;--c4:#DBE6F2;--pl:#2A2438;--pl-i:#D9CFF3;--pt:#1C2F31;--pt-i:#BDE3E8;--pd:#33291A;--pd-i:#F0D6AE;--px:#2A2823;--px-i:#DDD8CC;--okfg:#151310;
  --acc:#7DD3E8;--acc-soft:rgba(125,211,232,.12);--acc-line:rgba(125,211,232,.35);--ora:#F3A56D;--ora-soft:rgba(243,165,109,.14);--pur:#B9A2FF;--pur-soft:rgba(185,162,255,.12);--up-soft:rgba(139,224,180,.12);--dn-soft:rgba(255,138,138,.12);--warn-soft:rgba(243,194,109,.12)}
.phone :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.stack{position:absolute;inset:0;overflow:hidden;background:var(--bg);border-radius:var(--ir)}
.stack.carded{border-radius:max(var(--ir),12px)}
#main{position:absolute;inset:0}
.phone.no-tr *,.phone.no-tr *::before,.phone.no-tr *::after{transition:none!important}
.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;visibility:hidden;--on:0;background:var(--bg)} /* 唔鎖 touch-action：方向由瀏覽器定，斜斜地都照碌；只有明顯橫掃先由手勢接手 */
.views.pg .view.on{will-change:transform}
.view::-webkit-scrollbar,.sh-body::-webkit-scrollbar,.seg::-webkit-scrollbar,.push::-webkit-scrollbar,.sr-list::-webkit-scrollbar{display:none}
.view.on{visibility:visible;--on:1} /* --on 逼入面每個元素重新計樣式：只轉 visibility 嘅話，郁緊或者郁過動畫嘅元素（細分頁內容）會用舊樣式，切細分頁之後一直收埋（2026-11-07 踩到） */
.inner{position:relative;z-index:1;min-height:100%;padding:var(--sat) 16px 124px}

/* 撳落去：撳落快、放手彈；scale 只郁合成層 */
[data-p]{transition:transform calc(var(--d-press)*var(--k)) var(--s-press)}
[data-p].is-down{transition:transform calc(80ms*var(--k)) cubic-bezier(.3,0,.2,1)}
[data-p=btn].is-down{transform:scale(.96)}
[data-p=card].is-down{transform:scale(.975)}
[data-p=row].is-down{transform:scale(.985)}
[data-p=ico].is-down{transform:scale(.9)}
[data-p=chk].is-down{transform:scale(.9)}
[data-p=seg].is-down{transform:scale(.95)}
[data-p=row]{position:relative}
[data-p=row]::before{content:"";position:absolute;inset:0 -8px;border-radius:12px;background:var(--wash);opacity:0;transition:opacity calc(260ms*var(--k)) ease-out;pointer-events:none}
[data-p=row].is-down::before{opacity:1;transition-duration:calc(60ms*var(--k))}
[data-p=ico]{position:relative}
[data-p=ico]::before{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--wash);opacity:0;pointer-events:none;transition:opacity calc(240ms*var(--k)) ease-out}
[data-p=ico].is-down::before{opacity:1;transition-duration:calc(60ms*var(--k))}

/* 頂部 */
.tb{position:absolute;z-index:5;top:0;left:0;right:0;height:calc(var(--sat) + 52px);display:flex;align-items:flex-end;padding:0 8px 4px 16px;pointer-events:none}
.tb-bg{position:absolute;inset:0;background:var(--tbbg);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);opacity:0;visibility:hidden}
.tb-title{position:relative;flex:1;font:900 17px/44px var(--serif);opacity:0}
.tb-acts{position:relative;display:flex;gap:2px;pointer-events:auto}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.ico svg{position:relative;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-th{position:relative;display:block;width:21px;height:21px}
.ic-th svg{position:absolute;inset:0;transition:transform calc(420ms*var(--k)) var(--s-pop),opacity calc(180ms*var(--k))}
.phone[data-theme=day] .ic-th .sun,.phone[data-theme=night] .ic-th .moon{opacity:0;transform:rotate(-70deg) scale(.6)}
.lgt{min-height:50px;margin-bottom:10px;transform-origin:0 50%}
.mast{padding:7px 140px 0 0;font:900 30px/1.15 var(--serif);letter-spacing:.02em}
.mast-d{margin-top:4px;font-size:12.5px;color:var(--mut)}

/* 底部 5 格 */
.dock{position:absolute;z-index:6;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));height:62px;display:flex;padding:5px;background:var(--dock);border-radius:24px;box-shadow:0 10px 28px var(--shadow);transform-origin:50% 100%;transition:transform calc(420ms*var(--k)) var(--s-dock)}
.dock.mini{transform:translateY(8px) scale(.93)}
.dock-pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);transform:translateX(calc(var(--i,0)*100%));transition:transform calc(var(--d-dock)*var(--k)) var(--s-dock)}
.dock.pg .dock-pill,.dock.pgd button{transition:none}
.dock-pill i{display:block;height:100%;border-radius:19px;background:var(--dock-pill)}
.dock button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;font-size:12px;font-weight:700;color:var(--dock-ink);transition:color calc(180ms*var(--k)) ease-out}
.dock button[aria-current=page]{color:var(--dock-on)}
.dock .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:translateY(var(--iy,0)) scale(var(--is,1));transition:transform calc(380ms*var(--k)) var(--s-press)}
.dock button.is-down .ic{--is:.88;transition-duration:calc(80ms*var(--k))}
.dock .lb{transition:opacity calc(160ms*var(--k)) ease-out}
.dock.mini .lb{opacity:0}.dock.mini .ic{--iy:8px}

/* 細分頁 */
.seg-wrap{position:sticky;top:calc(var(--sat) + 52px);z-index:3;margin:0 -16px 8px;padding:6px 16px 8px;background:var(--bg)}
.seg{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg-ind{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--ink);transition:transform calc(var(--d-dock)*var(--k)) var(--s-dock),width calc(var(--d-dock)*var(--k)) var(--s-dock)}
.seg button{position:relative;flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--mut);white-space:nowrap;transition:transform calc(var(--d-press)*var(--k)) var(--s-press),color calc(180ms*var(--k)) ease-out}
.seg button[aria-selected=true]{color:var(--bg)}
.seg-s{margin-top:10px;padding:0;background:var(--card2);border-radius:999px}
.seg-s button{flex:1;min-height:34px;padding:0;font-size:12.5px;text-align:center}
.seg-s button::after{content:"";position:absolute;inset:-5px 0}
.pane{min-height:58vh}

/* 內容 */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 10px;font:900 20px/1.3 var(--serif)}
.sec small{font-family:var(--sans);white-space:nowrap}
.head{margin-bottom:18px}
.head button{display:block;width:100%}
.head-t{display:block;font:900 30px/1.26 var(--serif);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.head-t .num{font-weight:800;letter-spacing:-.01em}
.head-d{display:block;margin-top:8px;font:500 15px/1.75 var(--serif);color:var(--ink2);text-wrap:pretty}
.head-m{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--warn)}

.todo{padding:14px 16px 8px}
.todo-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;font-size:16px;font-weight:900}
.todo-c{display:inline-block;font-size:12.5px;font-weight:500;color:var(--mut)}
.todo.alldone .todo-c{color:var(--up);font-weight:700}
.it{display:flex;align-items:center;gap:2px;margin-left:-8px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.chk{flex:none;align-self:stretch;display:grid;place-items:center;width:44px;min-height:48px}
.chk svg{width:28px;height:28px;overflow:visible}
.chk .o{fill:none;stroke:var(--line2);stroke-width:1.75}
.chk .f{fill:var(--up);transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform calc(var(--d-pop)*var(--k)) var(--s-pop)}
.chk .t{fill:none;stroke:var(--okfg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset calc(200ms*var(--k)) ease-out}
.it.done .f{transform:scale(1)}
.it.done .t{stroke-dashoffset:0;transition-delay:calc(90ms*var(--k))}
.it-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 2px 8px 2px}
.it .m{flex:1;min-width:0}
.it .m>b{display:block;font-size:15.5px}
.it .m small{display:block;margin-top:1px;transition:opacity calc(240ms*var(--k))}
.strike{background:linear-gradient(currentColor,currentColor) 0 56%/0 1.5px no-repeat;transition:background-size calc(300ms*var(--k)) var(--ease),color calc(240ms*var(--k))}
.it.done .strike{background-size:100% 1.5px;color:var(--mut)}
.it.done .m small{opacity:.6}
.it .r{flex:none;font-weight:700;text-align:right;white-space:nowrap}
.it .r small{display:block;font-family:var(--sans)}
.note{margin:2px 0 6px;font-size:12.5px;line-height:1.6;color:var(--mut)}
.todo-empty{padding:12px 0 10px;text-align:center}
.todo-empty b{display:block;font:900 18px/1.4 var(--serif)}
.todo-empty small{display:block;margin-top:2px;font-size:13px}

.acct{margin-top:12px;padding:16px 16px 12px}
.acct-lab{display:block;min-height:18px;font-size:12.5px;color:var(--mut)}
.hero{display:block;margin:1px 0 8px;font-size:46px;font-weight:800;line-height:1.08;letter-spacing:-.025em}
.row3{display:flex;gap:20px;margin-bottom:10px;font-size:12px;color:var(--mut)}
.row3 b{display:block;font-size:15px;font-weight:700}
.scrub{position:relative;height:128px;color:var(--up);touch-action:pan-y;cursor:crosshair;transition:color calc(260ms*var(--k))}
.scrub.neg{color:var(--dn)}
.scrub svg{display:block;width:100%;overflow:visible}
.scrub .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrub .base{opacity:0;transition:opacity calc(160ms*var(--k))}
.scrub.on .base{opacity:.28}
.scrub .zero{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
.scrub .cross{stroke:var(--mut);stroke-width:1;opacity:0}
.scrub .pt{fill:currentColor;stroke:var(--card);stroke-width:2;opacity:0}
.scrub.on .cross,.scrub.on .pt{opacity:1}

.alloc{display:flex;gap:2px;height:14px;margin:2px 0 12px}
.alloc i{display:block;min-width:4px;border-radius:2px}
.alloc i:first-child{border-radius:7px 2px 2px 7px}.alloc i:last-child{border-radius:2px 7px 7px 2px}
.leg-lead{background:var(--c1)}.leg-trend{background:var(--c2)}.leg-dip{background:var(--c3)}.leg-xr{background:var(--c4)}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{display:block;min-height:136px;padding:14px;border-radius:20px;font-size:12.5px;line-height:1.5}
.pot-n{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%}
.pot-v{display:block;margin:2px 0 5px;font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.pot-l{display:block}
.pot-lead{background:var(--pl);color:var(--pl-i)}.pot-trend{background:var(--pt);color:var(--pt-i)}.pot-dip{background:var(--pd);color:var(--pd-i)}.pot-xr{background:var(--px);color:var(--px-i)}

.news li{border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.news button{display:grid;grid-template-columns:30px 1fr;gap:4px;width:100%;padding:12px 0;font:500 15.5px/1.72 var(--serif);text-wrap:pretty}
.news i{font:900 22px/1.25 var(--serif)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 div{min-width:0}
.g4 span{display:block;font-size:12px;color:var(--mut)}
.g4 b{display:block;font-family:var(--num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.g4 small{display:block}

.hr{display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:9px 0;border-top:1px solid var(--line)}
.hr.first,.hr:first-child{border-top:0}
.hr .sw{flex:none;width:6px;height:30px;border-radius:3px}
.hr .m{flex:1;min-width:0}
.hr .m b{display:block;font-size:15.5px;font-weight:700}
.hr .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .r{text-align:right;font-size:14.5px;font-weight:700;white-space:nowrap}
.hr .r small{display:block;font-weight:400}
.sr{display:grid;grid-template-columns:minmax(0,1fr) 66px 92px;gap:8px;align-items:center;width:100%;min-height:62px;padding:8px 0;border-top:1px solid var(--line)}
.sr:first-child{border-top:0}
.sr b{display:block;font-size:15.5px}
.sr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .rr{text-align:right;font-size:14px;font-weight:700}
.sr .rr small{font-weight:400;font-family:var(--sans)}
.spark{display:block;width:66px;height:26px;fill:none;stroke:var(--mut);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.more-b{display:block;width:100%;min-height:44px;margin-top:6px;border-radius:12px;background:var(--card2);font-size:13.5px;font-weight:700;text-align:center}
.ph{padding:44px 20px;text-align:center;color:var(--mut)}
.ph b{display:block;margin-bottom:4px;font:900 20px var(--serif);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:500;color:var(--mut);text-align:right;padding:0 0 7px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{padding:9px 0 9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ai li{padding:11px 0;border-top:1px solid var(--line);font:500 15.5px/1.72 var(--serif);text-wrap:pretty}
.ai li:first-child{border-top:0;padding-top:0}

/* 展開卡 */
.leg{border-top:1px solid var(--line)}
.leg-h{display:grid;grid-template-columns:8px 1fr auto 18px;align-items:center;gap:10px;width:100%;min-height:52px}
.leg-h b{font-size:15px}
.leg-h .pc{font-weight:700;font-size:14.5px}
.chev{width:16px;height:16px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform calc(220ms*var(--k)) var(--ease)}
.leg.open .chev{transform:rotate(90deg)}
.leg-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(260ms*var(--k)) var(--ease)}
.leg.open .leg-b{grid-template-rows:1fr}
.leg-i{min-height:0;overflow:hidden;opacity:0;transition:opacity calc(160ms*var(--k)) ease-out}
.leg.open .leg-i{opacity:1;transition-duration:calc(280ms*var(--k));transition-delay:calc(60ms*var(--k))}
.leg-i p{padding:0 0 10px 18px;font-size:13px;color:var(--mut)}

/* 圖 */
.ch{position:relative;touch-action:pan-y;cursor:crosshair}
.ch svg{display:block;width:100%;overflow:visible}
.ch text{font:11.5px var(--num);fill:var(--mut);font-size:12px}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch .cross{stroke:var(--mut);stroke-width:1;opacity:0}
.ch .pt{opacity:0;stroke:var(--card);stroke-width:2}
.ch .tip{position:absolute;top:0;padding:5px 8px;border-radius:8px;background:var(--tip);color:var(--tip-i);font-size:12px;line-height:1.45;white-space:nowrap;pointer-events:none;opacity:0}
.ch.on .cross,.ch.on .pt,.ch.on .tip{opacity:1}

/* 大市事件線 */
.evch{--evbg:var(--card);margin:2px -6px 0}
.push .evch{--evbg:var(--bg)}
.evch .tip{z-index:2;max-width:74%;white-space:normal}
.evch .ar{fill:var(--wash)}
.evch .ln{stroke-width:1.6}
.evch .last{fill:var(--l1)}
.evch .lnk{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3}
.evch .lnk,.evch .last,.evch .cross,.evch .pt{pointer-events:none}
.evch [data-ev]{cursor:pointer}
.evch .e-up{--e:var(--up)}.evch .e-dn{--e:var(--dn)}.evch .e-wr{--e:var(--warn)}
.evch .tag rect.box{fill:var(--evbg);stroke:var(--line2)}
.evch .tag text{font:700 12px var(--sans);fill:var(--ink)}
.evch .dot{fill:var(--e);stroke:var(--evbg);stroke-width:1}
.evch .ring{fill:var(--evbg);stroke:var(--e);stroke-width:2.2}
.ev-lg{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:12px;line-height:1.5;color:var(--mut)}
.ev-lg i{font-style:normal}
.evl{margin-top:8px}
.evr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;width:100%;min-height:44px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.evr:first-child{border-top:0}
.evr .d{padding-top:2px;font-size:12px;color:var(--mut)}
.evr b{font-size:15px;font-weight:700}
.evr .chg{margin-left:4px;font-size:13px;font-weight:700}
.evr small{display:block;margin-top:2px;line-height:1.5}
.ev-src{margin-top:12px;font-size:13px;line-height:1.7;color:var(--mut)}
.ev-src a{color:var(--ink2);text-decoration:underline;overflow-wrap:anywhere}
.lg-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.lg-row i{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle;background:var(--lc,currentColor)}
.lg-row i.dash{background:repeating-linear-gradient(90deg,var(--lc) 0 4px,transparent 4px 7px)}
.lg-row b{color:var(--ink);font-weight:500}
.lad{margin:14px 0 2px}
.lad-t{position:relative;height:4px;border-radius:2px;background:var(--line2)}
.lad-t i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;box-shadow:0 0 0 2px var(--sheet)}
.lad-t .a{left:0;margin-left:0;background:var(--dn)}
.lad-t .c{background:var(--ink)}
.lad-t .b{left:100%;margin-left:-10px;background:var(--up)}
.lad-l{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--mut)}
.lad-l span:nth-child(2){text-align:center}.lad-l span:nth-child(3){text-align:right}
.lad-l b{display:block;font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* 下拉更新 */
.ptr{position:absolute;z-index:0;top:calc(var(--sat) + 8px);left:50%;width:30px;height:30px;margin-left:-15px;opacity:0;color:var(--ink);pointer-events:none}
.ptr svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.ptr .bg{opacity:.18}
.ptr .fg{stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:50% 50%}
.ptr.spin svg{animation:spin calc(800ms*var(--k)) linear infinite}
.ptr.spin .fg{stroke-dashoffset:.72}
.ptr .ok{stroke:var(--up);stroke-dasharray:1;stroke-dashoffset:1}
.ptr.done .fg,.ptr.done .bg{opacity:0}
.ptr.done .ok{stroke-dashoffset:0;transition:stroke-dashoffset calc(220ms*var(--k)) ease-out}
@keyframes spin{to{transform:rotate(360deg)}}

/* 底部詳情 */
.sheet-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.sh-bg{position:absolute;inset:0;background:var(--backdrop);opacity:0;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:0 -6px 30px var(--shadow);outline:0;pointer-events:auto;will-change:transform}
.sheet::after{content:"";position:absolute;top:100%;left:0;right:0;height:160px;background:var(--sheet)}
.sh-grab{flex:none;display:grid;place-items:center;height:24px;cursor:grab;touch-action:none}
.sh-grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--line2);transition:width calc(180ms*var(--k)) var(--ease)}
.sheet.dragging .sh-grab i{width:48px}
.sh-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px calc(24px + env(safe-area-inset-bottom));scrollbar-width:none}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;touch-action:none;cursor:grab}
.sh-sym{display:inline-block;font-size:26px;font-weight:800;line-height:1.2}
.sh-tt{display:block;font:900 24px/1.25 var(--serif)}
.sh-head small{display:block}
.x{flex:none;margin:-4px -8px 0 0;background:none}
.sh-px{margin:8px 0 10px;font-size:15px;font-weight:700}
.sh-px .num:first-child{font-size:24px;font-weight:800;margin-right:6px}
.why{margin-top:14px;font:500 15px/1.75 var(--serif)}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;min-height:48px;border-radius:14px;background:var(--card2);font-weight:700;text-align:center}
.btn.main{background:var(--ink);color:var(--bg)}
.flyer{position:absolute;z-index:15;margin:0;transform-origin:0 0;pointer-events:none;color:var(--ink);white-space:nowrap;will-change:transform}

/* 推入新頁 */
.push-dim{position:absolute;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none}
.push{position:absolute;inset:0;z-index:8;overflow-y:auto;overscroll-behavior-y:contain;background:var(--bg);box-shadow:-14px 0 36px var(--shadow);will-change:transform;scrollbar-width:none}
.push[hidden]{display:none}
.pn{position:sticky;top:0;z-index:2;display:flex;align-items:flex-end;height:calc(var(--sat) + 52px);padding:0 16px 4px 4px;background:var(--tbbg);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px)}
.back{display:flex;align-items:center;gap:1px;min-height:44px;padding:0 10px 0 6px;font-weight:700;border-radius:12px}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.art{padding:10px 20px 60px}
.art small{display:block;margin-bottom:8px}
.art h1{font:900 28px/1.32 var(--serif);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.art p{margin-top:16px;font:500 17px/1.9 var(--serif);text-wrap:pretty;-webkit-user-select:text;user-select:text}
.plist{padding:0 16px 60px}
.plist h1{margin:6px 0 10px;font:900 28px/1.3 var(--serif)}

/* 搜尋 */
.search{position:absolute;inset:0;z-index:9;background:var(--bg)}
.search[hidden]{display:none}
.sr-top{display:flex;align-items:center;gap:0;padding:calc(var(--sat) + 4px) 0 8px 12px}
.sr-bar{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 12px;border-radius:22px;background:var(--card2);color:var(--ink)}
.sr-bar svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-bar input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:16px var(--sans);-webkit-user-select:text;user-select:text}
.sr-bar input::placeholder{color:var(--mut)}
.sr-bar input::-webkit-search-cancel-button{display:none}
.sr-x{flex:none;width:62px;min-height:44px;font-weight:700;text-align:center}
.sr-list{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 56px);bottom:0;overflow-y:auto;padding-bottom:30px;scrollbar-width:none}

/* 提示 */
.toasts{position:absolute;z-index:12;left:16px;right:16px;bottom:88px;display:flex;justify-content:center;pointer-events:none}
.toast{display:flex;align-items:center;max-width:100%;min-height:44px;padding:0 16px;border-radius:14px;background:var(--tip);color:var(--tip-i);font-size:13.5px;box-shadow:0 8px 24px var(--shadow);pointer-events:auto;touch-action:none;will-change:transform}

/* 骨架屏 */
.sk-row{display:grid;grid-template-columns:minmax(0,1fr) 66px 92px;gap:8px;align-items:center;min-height:62px;border-top:1px solid var(--line)}
.sk-row:first-child{border-top:0}
.sk{position:relative;display:block;overflow:hidden;border-radius:6px;background:var(--card2)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--wash),transparent);transform:translateX(-100%);animation:shim calc(1100ms*var(--k)) ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* 開場 */
.splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg)}
.splash[hidden]{display:none}
.sp-e{position:relative;z-index:1;margin-top:-40px}.sp-icon{display:block;width:72px;height:72px}
.sp-e .ic-l,.sp-e .ic-a{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}.sp-e .ic-r{opacity:0}
.sp-win{position:absolute;background:#0d6b58}.sp-win[hidden]{display:none}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

.phone[data-rm] *,.phone[data-rm] *::before,.phone[data-rm] *::after{transition-duration:1ms!important;animation-duration:1ms!important;transition-delay:0ms!important}

/* ───── 功能嘅內容（build.py 由 engine.html 抽，全部加 .lg 前綴）；下面嗰段先係新介面嘅包裝 */
.lg *{box-sizing:border-box}
.lg main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 104px;display:flex;flex-direction:column;gap:14px}
.lg h1,.lg h2,.lg p{margin:0}
.lg h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.lg h2{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lg .num,.lg .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lg .muted{color:var(--muted)}
.lg .small{font-size:13px}
.lg .up{color:var(--buy)}
.lg .dn{color:var(--stop)}
.lg main>*{min-width:0;max-width:100%}
.lg .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px;min-width:0}
.lg .brand{font-family:var(--brand);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 14px var(--acc-line);white-space:nowrap;flex:none}
.lg .brand span{color:var(--ink);opacity:.55}
.lg .chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .card{position:relative;background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--glow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lg .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--acc-line),transparent 35%,transparent 65%,var(--up-soft));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.lg .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lg .spread{justify-content:space-between}
.lg .light{display:flex;align-items:center;gap:14px}
.lg .orb{width:16px;height:16px;border-radius:50%;flex:none;position:relative}
.lg .orb.g{background:var(--buy);box-shadow:0 0 16px var(--buy),0 0 40px var(--up-soft)}
.lg .orb.r{background:var(--stop);box-shadow:0 0 16px var(--stop),0 0 40px var(--dn-soft)}
.lg .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid currentColor;opacity:.5;animation:ping 2.4s ease-out infinite}
.lg .orb.g::after{color:var(--buy)}
.lg .orb.r::after{color:var(--stop)}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.lg .status{font-family:var(--brand);font-size:18px;font-weight:800;letter-spacing:.12em}
.lg .gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg .gauge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.lg .gauge span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.6;min-height:3.2em}
.lg .gauge b{font-family:var(--mono);font-size:15px}
.lg .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.lg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--buy));box-shadow:0 0 10px var(--cyan)}
.lg .sig .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lg .sym{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.04em}
.lg .ind{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.lg .tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.lg .t-cyan{color:var(--cyan);background:var(--cyan-soft);border-color:var(--acc-line)}
.lg .t-buy{color:var(--buy);background:var(--buy-soft);border-color:var(--up-soft)}
.lg .t-stop{color:var(--stop);background:var(--stop-soft);border-color:var(--dn-soft)}
.lg .t-warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-soft)}
.lg [data-sersym]{cursor:pointer}
.lg .t-ser{color:var(--pur);background:var(--pur-soft);border-color:var(--pur-soft)}
.lg .t-tr{color:var(--ora);background:var(--ora-soft);border-color:var(--ora-soft)}
.lg .t-pe{color:var(--pur);background:var(--pur-soft);border-color:var(--pur-soft);cursor:pointer}
.lg [data-trsym]{cursor:pointer}
.lg .t-dim{color:var(--muted);background:var(--line);border-color:var(--line)}
.lg .price{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.1;color:var(--cyan);text-shadow:0 0 18px var(--acc-line)}
.lg .lbl{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.lg .dist{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.lg .dist .bar{flex:1;margin:0}
.lg .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.lg .kv span{display:block;font-size:12px;color:var(--muted)}
.lg .kv b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lg details{border-top:1px dashed var(--line2);padding-top:8px}
.lg summary{cursor:pointer;font-size:12px;color:var(--cyan);letter-spacing:.06em;list-style:none}
.lg summary::-webkit-details-marker{display:none}
.lg summary::before{content:"▸ ";}
.lg details[open] summary::before{content:"▾ ";}
.lg details p{font-size:13px;color:var(--muted);margin-top:6px}
.lg details b{color:var(--ink);font-family:var(--mono)}
.lg .tablewrap{overflow-x:auto;border-radius:12px;box-shadow:var(--glow);background:var(--panel)}
.lg table{border-collapse:collapse;width:100%;font-size:13px}
.lg th,.lg td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.lg th{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--acc-soft);position:sticky;top:0}
.lg tr:last-child td{border-bottom:0}
.lg td.r,.lg th.r{text-align:right}
.lg td.hl{color:var(--cyan);font-weight:700}
.lg .alert,.lg .info,.lg .ok{border-radius:12px;padding:10px 14px;border:1px solid}
.lg .alert{background:var(--stop-soft);border-color:var(--dn-soft)}
.lg .info{background:var(--warn-soft);border-color:var(--warn-soft)}
.lg .ok{background:var(--buy-soft);border-color:var(--up-soft)}
.lg button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:8px 14px;cursor:pointer}
.lg button.primary{background:linear-gradient(135deg,var(--acc-line),var(--up-soft));border-color:var(--acc-line);color:var(--ink)}
.lg button:focus-visible,.lg input:focus-visible,.lg summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.lg select{font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
.lg input[type=range]{accent-color:var(--cyan);padding:0;border:0;background:none;height:28px}
.lg .hbtn{display:flex;gap:6px}
.lg .hbtn button{flex:1;padding:6px 0}
.lg input{font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
.lg .grid2{display:grid;grid-template-columns:1fr;gap:10px}
.lg .chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.lg .chips button{flex:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--muted)}
.lg .chips button[aria-pressed="true"]{color:var(--bg);background:var(--cyan);border-color:var(--cyan);font-weight:700;box-shadow:0 0 14px var(--acc-line)}
.lg .news{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.lg .news:last-child{border-bottom:0}
.lg .news a{color:var(--ink);text-decoration:none;font-weight:500;line-height:1.45}
.lg .news a:hover{color:var(--cyan)}
.lg .news .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lg .ev{display:grid;grid-template-columns:54px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lg .ev:last-child{border-bottom:0}
.lg .ev .exp{grid-column:2;font-size:12px;color:var(--ink);margin-top:4px}
.lg .ev .exp summary{cursor:pointer;color:var(--cyan);font-size:12px;line-height:1.5}
.lg .ev .exp p{margin:4px 0;line-height:1.5}
.lg .ev .aiexp{border-left:2px solid var(--cyan);padding-left:8px}
.lg .ev .tm{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.lg .ev .tm small{color:var(--muted);font-size:12px}
.lg .ev .nm{font-weight:500;line-height:1.35}
.lg .ev .en{display:block;font-size:12px;color:var(--muted);font-weight:400}
.lg .ev .vals{grid-column:2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.lg .ev .vals b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.lg .ev.done .vals b.act{color:var(--buy);text-shadow:0 0 10px var(--up-soft)}
.lg .imp{display:inline-flex;gap:2px;vertical-align:middle;margin-right:5px}
.lg .imp i{width:4px;height:10px;border-radius:1px;background:var(--line2)}
.lg .imp.i3 i{background:var(--stop);box-shadow:0 0 6px var(--stop)}
.lg .imp.i2 i:nth-child(-n+2){background:var(--warn)}
.lg .imp.i1 i:first-child{background:var(--muted)}
.lg .dayhd{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:10px 0 3px;color:var(--muted);border-bottom:1px solid var(--line2)}
.lg .dayhd.now{color:var(--cyan)}
.lg .todayfab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;border-radius:999px;padding:8px 16px;font-size:13px;
  color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px var(--acc-line),0 6px 20px rgba(0,0,0,.5)}
@keyframes spSettle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lg .snap{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.lg .snap>.muted{flex-basis:100%;font-size:12px}

  path.push(c.capital); hold.push(c.capital);

    const want = i + 1 <= n ? pos(i + 1) : !!R[i - 1][3];

  if (!await askBox(on ? "暫停雲端更新？\n\n暫停之後：排名、模型、盤中、加密、雷達、研究等全部唔再自動更新，淨係新聞同 AI 今日重點照更新。\n（停超過兩個星期，模型帳戶恢復時可能要手動補數據）"

      headers: {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + S.ghToken, "X-GitHub-Api-Version": "2022-11-28"},

    if (Date.now() - t0 > 4 * 60e3){ PAUSE_MSG = "雲端仲未改到，遲啲再睇（或者再撳一次）"; render(); return; }

async function peakOK(what){

async function cloudRefresh(auto){
  if (!S.ghToken){ fetchFeeds(true); return; }

  const before = FEED.news && FEED.news.generated;

      headers: {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + S.ghToken, "X-GitHub-Api-Version": "2022-11-28"},
      body: JSON.stringify(auto ? {ref: "main", inputs: {relay: "1"}} : {ref: "main"})});
    if (r.status !== 204) throw new Error("GitHub 回覆 HTTP " + r.status + (r.status === 401 || r.status === 403 ? "（token 錯或者冇 Actions 權限）" : ""));
  } catch(e){ FEED.cloud = "觸發唔到：" + e.message; render(); fetchFeeds(true); return; }
  const t0 = Date.now();

  setTimeout(tick, 20e3);
}

}

function fedFor(r){           // 經濟數據行：議息／會議紀錄／主席講話 → 同日（前後一日）嘅聯儲局文件
  const F = (FEED.news && FEED.news.fed) || [];

  const cut = parts(HK, new Date(Date.now() - 2 * 86400e3)).date, cut2 = parts(HK, new Date(Date.now() + 4 * 86400e3)).date;
  const B = {old: {h: "", last: "", n: 0}, cur: {h: "", last: ""}, later: {h: "", last: "", n: 0}};

    const done = r.actual != null;
    const soon = !done && !nextMarked && r.d && r.d > new Date() && (nextMarked = true);
    const cmp = done && r.forecast ? (() => { const a = parseFloat(String(r.actual).replace(/[^\d.-]/g,"")), f = parseFloat(String(r.forecast).replace(/[^\d.-]/g,"")); return isFinite(a) && isFinite(f) && a !== f ? (a > f ? "高過預測" : "低過預測") : (isFinite(a) && a === f ? "同預測一樣" : ""); })() : "";

  }
  return h + (B.old.n ? `<details class="moreold"><summary class="small muted">之前嘅數據（${B.old.n} 項，撳開睇）</summary>${B.old.h}</details>` : "") + B.cur.h

function rsT(s){

  const used = new Set();
  return h.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith("<")) return part;
    for (const g of GL){
      if (used.has(g.i) || g.term.length < 2) continue;
      const t = esc(g.term), k = part.indexOf(t);

    return part.replace(/\u0001(\d+)\u0002/g, (m, i) => `<u class="rs-gl" data-gl="${i}">${esc(RS.gl[+i].term)}</u>`);

// 上下拖照樣碌頁（touch-action: pan-y）；拖過之後唔會當撳事件
function evScrub(box, g){
  box._g = g;
  box.insertAdjacentHTML("beforeend", `<div class="ev-x" hidden></div><div class="ev-dot" hidden></div><div class="ev-tip" hidden></div>`);
  if (box._scrub) return;
  box._scrub = true;
  let down = false, moved = false, x0 = 0, tm = 0;
  const show = cx => {
    const G = box._g, n = G.c.length, x = cx - box.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(n - 1, Math.round((x - G.pl) / (G.W - G.pl - G.pr) * (n - 1))));
    const near = G.evs.filter(e => Math.abs(e.i - i) <= Math.max(1, Math.round(n / 250))).sort((a, b) => Math.abs(a.i - i) - Math.abs(b.i - i))[0];
    const chg = i ? G.c[i] / G.c[i - 1] - 1 : null, X = G.X(i), Y = G.Y(G.c[i]);
    const [ln, dt, tp] = [".ev-x", ".ev-dot", ".ev-tip"].map(s => box.querySelector(s));
    if (!tp) return;
    ln.hidden = dt.hidden = tp.hidden = false;
    ln.style.left = dt.style.left = X + "px"; dt.style.top = Y + "px";
    tp.innerHTML = `<b>${esc(G.d[i])}</b> · ${f2(G.c[i])}${chg != null ? ` <span class="${chg >= 0 ? "up" : "dn"}">${pct(chg)}</span>` : ""}${near ? `<br>${esc(near.label)}` : ""}`;
    tp.style.left = Math.min(G.W - tp.offsetWidth - 4, Math.max(4, X - tp.offsetWidth / 2)) + "px";
  };
  const hide = () => { clearTimeout(tm); tm = setTimeout(() => box.querySelectorAll(".ev-x,.ev-dot,.ev-tip").forEach(e => e.hidden = true), 2500); };
  box.addEventListener("pointerdown", e => { down = true; moved = false; x0 = e.clientX; clearTimeout(tm); });
  box.addEventListener("pointermove", e => {
    if (e.pointerType === "mouse"){ show(e.clientX); return; }
    if (!down) return;
    if (Math.abs(e.clientX - x0) > 6) moved = true;
    if (moved) show(e.clientX);
  });
  box.addEventListener("pointerup", () => { down = false; hide(); });
  ["pointerleave", "pointercancel"].forEach(t => box.addEventListener(t, () => { down = false; hide(); }));
  box.addEventListener("click", e => { if (moved){ moved = false; e.stopPropagation(); e.preventDefault(); } }, true);
}

// 研究報告：AI 研究事件優先；同一段時間冇嘅，用事件線嘅數據事件補返（2026-10-21 用戶：「歷史就用翻歷史數據加翻落去」）
async function evMergeRes(r){
  if (!r || r._ev || !evHas(r.sym)) return;
  try {
    const M = await evGet(r.sym), C = r.chart || {}, pos = new Map((C.d || []).map((d, i) => [d, i]));
    const ai = (C.events || []).map(e => e.i);
    const add = M.events.filter(e => pos.has(M.chart.d[e.i])).map(e => ({...e, i: pos.get(M.chart.d[e.i]), w: Math.min(e.w || 1, 9)}))
      .filter(e => !ai.some(i => Math.abs(i - e.i) <= 3));
    C.events = (C.events || []).map(e => ({...e, w: 99})).concat(add); r._ev = true;
  } catch(e){}
}

// 現價、成本、公允價值嘅位置（底色 = 星級區：藍 5 星 → 橙 1 星）
function rsSlider(r, cost){
  const V = r.valuation, b = V.bands || [];
  if (!V.ok || b.length < 5) return "";
  const pts = [r.price, V.fv, b[0].max, b[3].max].concat(cost > 0 ? [cost] : []);
  const lo = Math.min(...pts) * 0.85, hi = Math.max(...pts) * 1.08;
  const X = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const edges = [lo, b[0].max, b[1].max, b[2].max, b[3].max, hi], cols = ["#4f9fdb", "#86c1e6", "#cdd2d9", "#e9b89c", "#f08f63"];
  const stops = [];
  for (let k = 0; k < 5; k++){ const a = X(edges[k]), z = X(edges[k + 1]); if (z > a) stops.push(`${cols[k]} ${((a + z) / 2).toFixed(1)}%`); }
  if (stops.length < 2) stops.push(stops[0] || "#cdd2d9");
  return `<div class="rs-sl"><div class="rs-sl-bar" style="background:linear-gradient(90deg,${stops.join(",")})"></div>
    ${cost > 0 ? `<i class="rs-mk mc" style="left:${X(cost)}%"></i>` : ""}<i class="rs-mk mf" style="left:${X(V.fv)}%"></i><i class="rs-mk mp" style="left:${X(r.price)}%"></i></div>
    <p class="rs-leg">${cost > 0 ? `<span><i class="lc"></i>成本 ${f2(cost)}</span>` : ""}<span><i class="lp"></i>現價 ${f2(r.price)}</span><span><i class="lf"></i>Claude 公允價值 ${f2(V.fv)}</span></p>`;
}

function rsPriceCard(r){

}

const JOB = {};
function stepName(n){
  if (n === "Set up job") return "準備雲端機器";
  if (n === "Complete job" || /^Post /.test(n)) return null;
  if (/checkout/i.test(n)) return "攞程式";
  if (/setup-python/i.test(n)) return "裝 Python";
  if (/pip install/i.test(n)) return "裝套件";
  return n;
}
async function ghGet(path){
  const r = await fetch(`https://api.github.com/repos/${repoOf()}${path}`, {cache: "no-store",
    headers: {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + S.ghToken, "X-GitHub-Api-Version": "2022-11-28"}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function trackRes(sym){
  const J = JOB[sym] = {t0: Date.now(), steps: [], msg: "已叫雲端，等緊 GitHub 開工…"};
  const tick = async () => {
    if (JOB[sym] !== J) return;
    try {
      if (!J.run){
        const d = await ghGet("/actions/workflows/research.yml/runs?event=workflow_dispatch&per_page=5");
        const r = (d.workflow_runs || []).find(x => Date.parse(x.created_at) >= J.t0 - 90e3);
        if (r){ J.run = r.id; J.url = r.html_url; }
      }
      if (J.run){
        const [run, jobs] = await Promise.all([ghGet(`/actions/runs/${J.run}`), ghGet(`/actions/runs/${J.run}/jobs`)]);
        J.steps = (jobs.jobs || []).flatMap(j => j.name === "pz" ? [{n: "暫停檢查", s: j.status, c: j.conclusion}]
          : (j.steps || []).map(s => ({n: stepName(s.name), s: s.status, c: s.conclusion})).filter(x => x.n));
        J.msg = run.status === "completed" ? (run.conclusion === "success" ? `寫好咗 ${sym}` : `雲端出錯（${run.conclusion}），撳下面連結睇原因`)
          : run.status === "queued" || run.status === "waiting" ? "雲端排緊隊…" : "雲端做緊（AI 上網搵資料、寫報告要幾分鐘）…";
        if (run.status === "completed"){
          J.done = run.conclusion;
          if (J.done === "success"){ RS.cache = {}; fetchResIndex(); setTimeout(fetchResIndex, 60e3); }   // GitHub Pages 發佈要多一兩分鐘
          if (TAB === "res") render(); return;
        }
      }
    } catch(e){ J.msg = "暫時讀唔到進度（" + e.message + "），會再試"; }
    if (TAB === "res") render();
    if (Date.now() - J.t0 > 30 * 60e3){ J.msg = "超過 30 分鐘都未完，撳下面連結去 GitHub 睇"; if (TAB === "res") render(); return; }
    setTimeout(tick, 10e3);
  };
  setTimeout(tick, 5e3);
}
function resJobCard(sym){
  const J = JOB[sym]; if (!J) return "";
  const ic = x => x.c === "success" ? "✓" : x.c === "skipped" ? "–" : x.c ? "✗" : x.s === "in_progress" ? "⏳" : "○";
  const cls = x => x.c === "success" ? "up" : x.c && x.c !== "skipped" ? "dn" : "";
  return `<div class="card"><div class="row spread"><b>生成 ${esc(sym)} 研究報告</b><span class="small muted">${Math.round((Date.now() - J.t0) / 60e3)} 分鐘</span></div>
