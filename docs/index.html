<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>龍頭突破</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&display=swap">
<style>
/* 未來科技風：深色底 + 細網格 + 霓虹青／綠。淨係深色（交易畫面長時間睇）。 */
:root{
  --bg:#05080d; --bg2:#0a1119; --panel:rgba(12,20,30,.78); --panel2:rgba(18,30,44,.72);
  --ink:#e6f1f7; --muted:#7f93a3; --dim:#4c6072; --line:rgba(120,200,255,.14); --line2:rgba(120,200,255,.26);
  --cyan:#00e5ff; --cyan-soft:rgba(0,229,255,.12); --buy:#2cf5a0; --buy-soft:rgba(44,245,160,.12);
  --stop:#ff4d6d; --stop-soft:rgba(255,77,109,.12); --warn:#ffc857; --warn-soft:rgba(255,200,87,.12);
  --glow:0 0 0 1px var(--line), 0 8px 30px rgba(0,0,0,.45), 0 0 26px rgba(0,229,255,.06);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --brand:"Orbitron",var(--mono);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden}   /* 頁面淨係上下捲，唔可以左右拉 */
@supports (overflow-x:clip){html,body{overflow-x:clip}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);
  background-image:
    radial-gradient(1200px 600px at 80% -10%, rgba(0,229,255,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(44,245,160,.07), transparent 60%),
    linear-gradient(rgba(120,200,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,200,255,.045) 1px, transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
h1{font-size:20px;font-weight:900;letter-spacing:.02em}
h2{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.up{color:var(--buy)} .dn{color:var(--stop)}

main>*{min-width:0;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px;min-width:0}
.brand{font-family:var(--brand);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.45);white-space:nowrap;flex:none}
.brand span{color:var(--ink);opacity:.55}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.card{position:relative;background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--glow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,229,255,.35),transparent 35%,transparent 65%,rgba(44,245,160,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .spread{justify-content:space-between}

/* 大市燈號 */
.light{display:flex;align-items:center;gap:14px}
.orb{width:16px;height:16px;border-radius:50%;flex:none;position:relative}
.orb.g{background:var(--buy);box-shadow:0 0 16px var(--buy),0 0 40px rgba(44,245,160,.5)}
.orb.r{background:var(--stop);box-shadow:0 0 16px var(--stop),0 0 40px rgba(255,77,109,.5)}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid currentColor;opacity:.5;animation:ping 2.4s ease-out infinite}
.orb.g::after{color:var(--buy)} .orb.r::after{color:var(--stop)}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.status{font-family:var(--brand);font-size:18px;font-weight:800;letter-spacing:.12em}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.gauge span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.gauge b{font-family:var(--mono);font-size:15px}
.bar{height:4px;border-radius:2px;background:rgba(120,200,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--buy));box-shadow:0 0 10px var(--cyan)}

/* 訊號卡 */
.sig .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sym{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.04em}
.ind{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.t-cyan{color:var(--cyan);background:var(--cyan-soft);border-color:rgba(0,229,255,.3)}
.t-buy{color:var(--buy);background:var(--buy-soft);border-color:rgba(44,245,160,.3)}
.t-stop{color:var(--stop);background:var(--stop-soft);border-color:rgba(255,77,109,.3)}
.t-warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(255,200,87,.3)}
[data-sersym]{cursor:pointer}
.t-ser{color:#c9a2ff;background:rgba(170,120,255,.12);border-color:rgba(170,120,255,.4)}
.t-tr{color:#ffb38a;background:rgba(255,120,60,.12);border-color:rgba(255,120,60,.45)}
[data-trsym]{cursor:pointer}
.t-dim{color:var(--muted);background:rgba(120,200,255,.06);border-color:var(--line)}
.price{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.1;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.35)}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.dist{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dist .bar{flex:1;margin:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
details{border-top:1px dashed var(--line2);padding-top:8px}
summary{cursor:pointer;font-size:12px;color:var(--cyan);letter-spacing:.06em;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";} details[open] summary::before{content:"▾ ";}
details p{font-size:13px;color:var(--muted);margin-top:6px}
details b{color:var(--ink);font-family:var(--mono)}

.tablewrap{overflow-x:auto;border-radius:12px;box-shadow:var(--glow);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700;background:rgba(0,229,255,.05);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.hl{color:var(--cyan);font-weight:700}

.alert,.info,.ok{border-radius:12px;padding:10px 14px;border:1px solid}
.alert{background:var(--stop-soft);border-color:rgba(255,77,109,.35)}
.info{background:var(--warn-soft);border-color:rgba(255,200,87,.3)}
.ok{background:var(--buy-soft);border-color:rgba(44,245,160,.3)}

button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(44,245,160,.2));border-color:rgba(0,229,255,.5);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select{font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
input[type=range]{accent-color:var(--cyan);padding:0;border:0;background:none;height:28px}
.hbtn{display:flex;gap:6px}.hbtn button{flex:1;padding:6px 0}
input{font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:736px;margin:0 auto;
  display:grid;grid-template-columns:repeat(7,1fr);z-index:5;border-radius:16px;background:rgba(8,14,22,.82);
  box-shadow:0 0 0 1px var(--line2),0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{border:0;background:none;padding:9px 2px 8px;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.5)}
nav button[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(0,229,255,.7))}

/* 新聞／經濟數據 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{color:var(--bg);background:var(--cyan);border-color:var(--cyan);font-weight:700;box-shadow:0 0 14px rgba(0,229,255,.45)}
.news{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.news a{color:var(--ink);text-decoration:none;font-weight:500;line-height:1.45}
.news a:hover{color:var(--cyan)}
.news .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev{display:grid;grid-template-columns:54px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .exp{grid-column:2;font-size:12px;color:var(--ink);margin-top:4px}
.ev .exp summary{cursor:pointer;color:var(--cyan);font-size:12px;line-height:1.5}
.ev .exp p{margin:4px 0;line-height:1.5}
.ev .aiexp{border-left:2px solid var(--cyan);padding-left:8px}
.ev .tm{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.ev .tm small{color:var(--dim)}
.ev .nm{font-weight:500;line-height:1.35}
.ev .en{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.ev .vals{grid-column:2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted)}
.ev .vals b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.ev.done .vals b.act{color:var(--buy);text-shadow:0 0 10px rgba(44,245,160,.4)}
.imp{display:inline-flex;gap:2px;vertical-align:middle;margin-right:5px}
.imp i{width:4px;height:10px;border-radius:1px;background:var(--line2)}
.imp.i3 i{background:var(--stop);box-shadow:0 0 6px var(--stop)} .imp.i2 i:nth-child(-n+2){background:var(--warn)} .imp.i1 i:first-child{background:var(--muted)}
.dayhd{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:10px 0 3px;color:var(--muted);border-bottom:1px solid var(--line2)}
.dayhd.now{color:var(--cyan)}
.todayfab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;border-radius:999px;padding:8px 16px;font-size:13px;
  color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.5),0 6px 20px rgba(0,0,0,.5)}
/* 開 app 動畫（2026-09-30） */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 38%,#0b1f2c 0%,#05090f 62%,#020406 100%);display:grid;place-items:center;overflow:hidden;
  transition:opacity .55s ease,filter .55s ease,transform .55s var(--ease)}
#splash.out{opacity:0;filter:blur(8px);transform:scale(1.06);pointer-events:none}
.sp-floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:62%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 0;
  background-image:linear-gradient(rgba(0,229,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.28) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask:linear-gradient(to bottom,transparent,#000 35%);mask:linear-gradient(to bottom,transparent,#000 35%);animation:floor 1.6s linear infinite}
@keyframes floor{to{background-position:0 44px}}
.sp-scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(to bottom,transparent,rgba(0,229,255,.10),transparent);animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{to{top:110%}}
.sp-core{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;animation:coreIn .7s var(--ease) both}
@keyframes coreIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.sp-ring{width:150px;height:150px;overflow:visible}
.sp-ring .a1{transform-origin:75px 75px;animation:spin 2.4s linear infinite}
.sp-ring .a2{transform-origin:75px 75px;animation:spin 3.6s linear infinite reverse}
.sp-ring .tick{transform-origin:75px 75px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-ring .chart{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.3s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-ring .dot{opacity:0;animation:dotin .4s 1.45s ease-out forwards}
@keyframes dotin{from{opacity:0;r:0}to{opacity:1;r:4.5}}
.sp-logo{font-family:var(--brand);font-weight:800;font-size:22px;letter-spacing:.2em;color:var(--cyan);white-space:nowrap}
.sp-logo b{display:inline-block;font-weight:800;opacity:0;animation:letter .5s var(--ease) forwards;animation-delay:calc(.35s + var(--k) * 45ms);
  text-shadow:0 0 18px rgba(0,229,255,.8)}
.sp-logo b.sl{color:var(--ink);opacity:0;text-shadow:none}
@keyframes letter{0%{opacity:0;transform:translateY(8px);filter:blur(6px)}60%{opacity:1;filter:blur(0);color:#fff}100%{opacity:1;transform:none}}
.sp-logo b.sl{animation-name:letterDim}
@keyframes letterDim{from{opacity:0}to{opacity:.55}}
.sp-sub{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);height:14px}
.sp-sub::after{content:"_";animation:blink 1s steps(1) infinite;color:var(--cyan)}
@keyframes blink{50%{opacity:0}}
.sp-bar{width:180px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--buy));box-shadow:0 0 12px var(--cyan);transition:width .45s var(--ease)}
.snap{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.snap>.muted{flex-basis:100%;font-size:11.5px}
.zm{font-size:11px;color:var(--dim);font-family:var(--mono)}
.gear{padding:5px;border-radius:999px;line-height:0;flex:none}
.gear svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round}
.gear.on svg{stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,229,255,.7))}
.qcmp{border-top:1px dashed var(--line2);padding-top:8px}
.btcchart{width:100%;height:90px;display:block}
.mtabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.mtabs button{flex:1}
.fngchart{width:100%;height:70px;display:block;margin-top:10px}
.fngbar{position:relative;height:10px;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,var(--stop) 0%,var(--warn) 35%,var(--muted) 50%,var(--buy) 75%,var(--buy) 100%);opacity:.9}
.fngbar i{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 8px var(--cyan)}
.warnc{color:var(--warn)}
details.card>summary::-webkit-details-marker{display:none}
/* 動畫（2026-09-30）：分頁滑入、卡片逐張浮入、底部指示條、撳落回饋、載入骨架 */
:root{--ease:cubic-bezier(.22,.9,.24,1)}
.rise{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms)}
@keyframes rise{from{opacity:0;transform:translate3d(var(--dx,0px),12px,0)}to{opacity:1;transform:none}}
.fadein{animation:fadein .22s ease-out both}
@keyframes fadein{from{opacity:.35}to{opacity:1}}
button{transition:transform .14s var(--ease),background-color .2s,box-shadow .25s,color .2s,border-color .2s}
button:active{transform:scale(.95)}
nav .pill{position:absolute;top:5px;bottom:5px;left:0;width:calc(100% / 7);padding:0 6px;pointer-events:none;transition:transform .42s var(--ease)}
nav .pill::before{content:"";display:block;height:100%;border-radius:12px;background:linear-gradient(180deg,rgba(0,229,255,.18),rgba(0,229,255,.04));
  box-shadow:inset 0 0 0 1px rgba(0,229,255,.3),0 0 20px rgba(0,229,255,.18)}
nav button{position:relative;z-index:1}
nav button:active{transform:scale(.9)}
nav button[aria-current="page"] svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.75) translateY(3px)}55%{transform:scale(1.18) translateY(-2px)}100%{transform:none}}
.skel{height:118px;border-radius:14px;background:linear-gradient(100deg,var(--panel) 30%,rgba(0,229,255,.07) 50%,var(--panel) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.skel.s2{height:220px}.skel.s3{height:160px}
@keyframes shim{from{background-position:120% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}
  .sp-logo b{opacity:1!important}.sp-logo b.sl{opacity:.55!important}.sp-ring .chart{stroke-dashoffset:0!important}.sp-ring .dot{opacity:1!important}}
@media (max-width:380px){.kv{grid-template-columns:repeat(2,1fr)} .price{font-size:30px}}
/* 手機：表格唔好闊過畫面 */
@media (max-width:600px){
  .hide-sm{display:none}
  th,td{padding:8px 5px;font-size:12px}
  td .ind{max-width:110px;white-space:normal}
  td.st,th.st{white-space:normal;min-width:84px} td.st .tag{white-space:normal;line-height:1.35}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-floor"></div><div class="sp-scan"></div>
  <div class="sp-core">
    <svg class="sp-ring" viewBox="0 0 150 150" fill="none" stroke-linecap="round">
      <circle cx="75" cy="75" r="70" stroke="rgba(0,229,255,.12)" stroke-width="1"/>

<script>
"use strict";
// ───────────────────────── 規則（RULES_V2.md V2.2）：app 淨係顯示訊號，買唔買由用戶自己決定
const RULE = { cap: 5, frac: 0.20, boost: 1.5, rankExit: 15, beR: 2, show: 10 };
const KEY = "signals-app";                // 舊版（v21-app）嘅持倉紀錄唔郁，淨係唔再用
const defaults = { capital: 0, dataUrl: "scan.json",
                   feedUrl: "https://raw.githubusercontent.com/ngheioffical-glitch/stock-app/feeds/",
                   liveUrl: "https://raw.githubusercontent.com/ngheioffical-glitch/stock-app/live/intraday.json" };

function load(){
  try {
    const cur = JSON.parse(localStorage.getItem(KEY));
    const s = cur || JSON.parse(localStorage.getItem("v21-app")) || {};       // 第一次：沿用舊版嘅數據網址
    return {...defaults, ...Object.fromEntries(Object.entries({capital: cur ? +cur.capital || 0 : 0,   // 舊版「現金」係餘額，唔當資金
      dataUrl: s.dataUrl, feedUrl: s.feedUrl, liveUrl: s.liveUrl, ghToken: cur ? cur.ghToken : "", follow: cur ? cur.follow : null,
      acct: cur ? cur.acct : ""}).filter(([, v]) => v))};
  } catch(e){ return {...defaults}; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load(), SCAN = null, TAB = "today", ERR = null;
try { TAB = localStorage.getItem(KEY + "-tab") || "today"; } catch(e){}

// ───────────────────────── 工具
const $ = s => document.querySelector(s);
const mdl = m => m ? `<span class="tag t-dim" title="用咗呢個 AI 型號">${esc(String(m).replace(/^github:/, "GitHub · "))}</span>` : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2 = x => (x == null || !isFinite(x)) ? "—" : Number(x).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const f0 = x => (x == null || !isFinite(x)) ? "—" : Math.round(x).toLocaleString("en-US");
const pct = (x, d=1) => (x == null || !isFinite(x)) ? "—" : (x >= 0 ? "+" : "") + (x*100).toFixed(d) + "%";
// 升 = 綠、跌 = 紅（用戶要求：app 入面所有升跌都咁顯示）
const chg = (x, d=1) => (x == null || !isFinite(x)) ? "" : `<span class="${x > 0 ? "up" : x < 0 ? "dn" : "muted"}">${x > 0 ? "▲" : x < 0 ? "▼" : ""}${pct(Math.abs(x), d).replace("+", "")}</span>`;
const dayChg = sym => { const c = SCAN?.stocks?.[sym]?.c10; return c && c.length > 1 ? c[c.length - 1] / c[c.length - 2] - 1 : null; };
const indOf = r =>r?.industry ? `${r.industry}${r.sector && r.sector !== r.industry ? " · " + r.sector : ""}` : "";
const HK = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Hong_Kong", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
const NY = new Intl.DateTimeFormat("en-CA", {timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
const parts = (fmt, d) => { const o = {}; fmt.formatToParts(d).forEach(p => o[p.type] = p.value); return {date:`${o.year}-${o.month}-${o.day}`, time:`${o.hour}:${o.minute}`}; };
const nyToday = () => parts(NY, new Date()).date;

// ───────────────────────── 訊號：排名由高到低、合格而收市仲低過前高嘅股（買入價 = 前高）
function signals(){
  if (!SCAN) return {list:[], why:"未有數據"};
  if (!SCAN.green) return {list:[], why:"大市紅燈：規則唔開新倉"};
  const fs = (typeof MODEL !== "undefined" && MODEL) ? followState(MODEL) : null, base = fs && fs.val ? fs.val : S.capital;   // 有跟單帳戶就用帳戶值
  const list = SCAN.ranking.filter(r => r.status === "候選").slice(0, RULE.show).map(r => {
    const frac = RULE.frac * (r.sym === SCAN.rank1 ? RULE.boost : 1);
    return {...r, frac, shares: base > 0 ? Math.floor(base * frac / r.pivot) : null};
  });
  return {list, why: list.length ? "" : "今日冇合格嘅突破候選股"};
}

// 持有嘅話要唔要賣（淨係睇規則，唔使記持倉）
function exitNote(r){
  const out = [];
  if (SCAN && !SCAN.green) out.push("大市紅燈");
  if (r.close < r.sma200) out.push("跌穿 200 日線");
  if (SCAN?.week_end && r.rank > RULE.rankExit) out.push(`排第 ${r.rank}`);
  return out;
}

// ───────────────────────── 畫面
function topbar(){
  return `<div class="topbar"><div class="brand">LEADER<span>//</span>BREAKOUT</div>
    <div class="row" style="gap:8px;flex-wrap:nowrap;min-width:0">${SCAN ? `<span class="chip">${esc(SCAN.date.slice(5))} 收市</span>` : ""}
    <button class="gear${TAB === "set" ? " on" : ""}" id="goSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div></div>`;
}

function header(){
  if (ERR) return `<div class="alert"><b>讀唔到數據</b><p class="small">${esc(ERR)}。去「設定」檢查數據網址，或者遲啲再試。</p></div>`;
  if (!SCAN) return "";
  const g = SCAN.green;
  const stale = Date.now() > Date.parse(SCAN.next_day + "T22:30:00Z") + 8 * 3600e3;
  const d200 = SCAN.ndx / SCAN.ndx_s200 - 1, d21 = SCAN.ndx / SCAN.ndx_e21 - 1, d50 = SCAN.ndx_e21 / SCAN.ndx_s50 - 1;
  const w = x => Math.max(4, Math.min(100, 50 + x * 500));
  return (stale ? `<div class="alert"><b>數據舊咗</b><p class="small">仲係 ${SCAN.date} 收市數據，${SCAN.next_day} 嘅應該已經出咗：自動掃描可能失敗，唔好照下面價錢落單。</p></div>` : "") + `<div class="card">
    <div class="row spread"><div class="light"><span class="orb ${g ? "g" : "r"}"></span><div><div class="status ${g ? "up" : "dn"}">${g ? "RISK ON" : "RISK OFF"}</div>
      <div class="small muted">${g ? "大市綠燈：可以買" : "大市紅燈：唔開新倉、持倉開市清"}</div></div></div>
      <span class="tag ${SCAN.week_end ? "t-warn" : "t-dim"}">${SCAN.week_end ? "週尾：檢查排名" : "平日"}</span></div>
    <div class="gauges">
      <div class="gauge"><span>NDX vs 200 日線</span><b class="${d200 >= 0 ? "up" : "dn"}">${pct(d200)}</b><div class="bar"><i style="width:${w(d200)}%"></i></div></div>
      <div class="gauge"><span>NDX vs 21 日 EMA</span><b class="${d21 >= 0 ? "up" : "dn"}">${pct(d21)}</b><div class="bar"><i style="width:${w(d21)}%"></i></div></div>
      <div class="gauge"><span>21 EMA vs 50 日線</span><b class="${d50 >= 0 ? "up" : "dn"}">${pct(d50)}</b><div class="bar"><i style="width:${w(d50)}%"></i></div></div>
    </div>
    <p class="small"><b>現金點擺：</b>${g ? "未用嘅現金買短期國債 ETF（<b>SGOV</b> 或 <b>BIL</b>）收息，要買股時先賣" : "賣晒股之後，現金買 <b>IEF</b>（7–10 年美國國債），轉返綠燈先賣"}</p>
    <p class="small muted">NDX <span class="num">${f0(SCAN.ndx)}</span> · 下一個交易日 <span class="num">${SCAN.next_day}</span>。綠燈 = NDX &gt; 200 日線，或者 NDX &gt; 21 日 EMA &gt; 50 日線。</p>
  </div>` + fearCard() + bounceCard() + fngCard("stock");
}
// 恐慌買入訊號（2026-10-01，scan.py fear_info；回測 stock-strategy/LAB_FEAR*.md）：VIX ≥ 30 第一日 → 下一日開市 40% 買 β 最高 5 隻，揸 20 日
function fearCard(){
  const F = SCAN && SCAN.fear;
  if (!F) return "";
  const note = `<p class="small muted">回測（同一個帳戶，2000–2026）：VIX ≥ 30 第一日之後 60 日，β 最高 5 隻平均跑贏 QQQ 6–7%（2000–12 同 2013– 都成立）；但同 V2.2 同一個帳戶照做 40%：全期年化少大約 1%、最大回撤 −49%（V2.2 −35%），因為 2021–22 籃子蝕錢觸發 V2.2 回撤剎車，2023 年少賺。2000–2012 就有幫助（15.6% vs 11.8%）。只係訊號，唔改 V2.2，自己決定。</p>`;
  if (!F.active){
    if (F.vix < 25) return `<div class="card"><div class="row spread"><span class="small muted">VIX（恐慌買入訊號 ≥ 30）</span><b class="mono">${F.vix.toFixed(1)}</b></div>
      <p class="small muted">平靜。上一次訊號：${esc((F.history || []).slice(-1)[0] || "—")}</p></div>`;
    return `<div class="card"><div class="row spread"><div><div class="small muted">VIX 接近恐慌買入訊號</div><div class="status warnc" style="font-size:15px">VIX ${F.vix.toFixed(1)}（≥ 30 觸發）</div></div></div>
      <p class="small">如果今晚收市 ≥ 30，下一日開市用 40% 資金平均買呢 5 隻（成交額頭 50 入面 β 最高）：${(F.preview || []).map(x => `<b>${esc(x.sym)}</b> β${x.beta}`).join("、")}</p>${note}</div>`;
  }
  const rows = (F.picks || []).map(x => `<tr><td class="mono"><b>${esc(x.sym)}</b><span class="ind">β ${x.beta}</span></td>
      <td class="r mono">${x.entry != null ? f2(x.entry) : "—"}</td><td class="r mono">${f2(x.close)}</td><td class="r mono ${x.ret >= 0 ? "up" : "dn"}">${x.ret != null ? pct(x.ret) : "—"}</td></tr>`).join("");
  const fs = (typeof MODEL !== "undefined" && MODEL) ? followState(MODEL) : null, cap = fs && fs.val ? fs.val : (S.capital || 0);
  return `<div class="alert"><b>恐慌買入訊號：${esc(F.trigger)} VIX 收市 ${F.trigger_vix.toFixed(1)} ≥ 30</b>
      <p class="small">${esc(F.buy_date)} 開市用 <b>40% 資金</b>平均買 5 隻（每隻 8%${cap ? `，約 ${f0(cap * 0.08)}` : ""}），揸 20 個交易日，<b>${esc(F.sell_date)} 開市賣</b>（唔跟 V2.2 止蝕）；之後資金返 V2.2，例如 V2.2 嘅突破買入照做。已揸 ${F.days_held} 日。</p></div>
    <div class="card"><div class="tablewrap"><table><tr><th>恐慌籃子</th><th class="r">買入</th><th class="r">收市</th><th class="r">回報</th></tr>${rows}</table></div>${note}</div>`;
}

// 比特幣燈號（2026-10-01；scanner/btc.py → feeds/btc.json，每 5 分鐘；回測 stock-strategy/LAB_BTC.md）
let BTC = null;
async function fetchBtc(){
  try { const b = S.feedUrl.endsWith("/") ? S.feedUrl : S.feedUrl + "/"; const r = await fetch(b + "btc.json?t=" + Math.floor(Date.now() / 60e3), {cache:"no-store"});
    if (r.ok){ BTC = await r.json(); if (TAB === "crypto") render(); } } catch(e){}
}
function btcChart(C){
  if (!C || C.length < 10) return "";
  const W = 320, Hh = 90, xs = C.map(x => x[1]).concat(C.map(x => x[2])), lo = Math.min(...xs), hi = Math.max(...xs);
  const X = i => (i / (C.length - 1) * W).toFixed(1), Y = v => (Hh - 4 - (v - lo) / (hi - lo || 1) * (Hh - 8)).toFixed(1);
  const pl = k => C.map((x, i) => `${X(i)},${Y(x[k])}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${Hh}" class="btcchart" preserveAspectRatio="none"><polyline points="${pl(2)}" fill="none" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <polyline points="${pl(1)}" fill="none" stroke="var(--cyan)" stroke-width="1.6"/></svg>
    <div class="small muted" style="display:flex;justify-content:space-between"><span>${esc(C[0][0])}</span><span><span style="color:var(--cyan)">━</span> BTC　<span style="color:var(--warn)">┅</span> 365 日線</span><span>${esc(C[C.length - 1][0])}</span></div>`;
}
// 恐慌貪婪指數（2026-10-01）：scanner/fng.py → feeds/fng.json（股市 CNN、加密 alternative.me）
let FNG = null;
async function fetchFng(){
  try { const b = S.feedUrl.endsWith("/") ? S.feedUrl : S.feedUrl + "/"; const r = await fetch(b + "fng.json?t=" + Math.floor(Date.now() / 60e3), {cache:"no-store"});
    if (r.ok){ FNG = await r.json(); if (TAB === "crypto" || TAB === "today") render(); } } catch(e){}
}
const fngCls = v => v < 25 ? "dn" : v < 45 ? "warnc" : v <= 55 ? "" : "up";
function fngSpark(H){
  if (!H || H.length < 10) return "";
  const W = 320, Hh = 70, X = i => (i / (H.length - 1) * W).toFixed(1), Y = v => (Hh - 2 - v / 100 * (Hh - 4)).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${Hh}" class="fngchart" preserveAspectRatio="none">
    <rect x="0" y="${Y(100)}" width="${W}" height="${(Y(75) - Y(100)).toFixed(1)}" fill="var(--buy)" opacity=".1"/>
    <rect x="0" y="${Y(25)}" width="${W}" height="${(Y(0) - Y(25)).toFixed(1)}" fill="var(--stop)" opacity=".12"/>
    <polyline points="${H.map((x, i) => `${X(i)},${Y(x[1])}`).join(" ")}" fill="none" stroke="var(--cyan)" stroke-width="1.5"/></svg>
    <div class="small muted" style="display:flex;justify-content:space-between"><span>${esc(H[0][0])}</span><span>${esc(H[H.length - 1][0])}</span></div>
    <div class="small muted">紅底 &lt; 25 極度恐慌 · 綠底 &gt; 75 極度貪婪</div>`;
}
function fngCard(kind){
  const F = FNG && FNG[kind];
  if (!F) return "";
  const v = F.score, cmp = [["昨日", F.prev], ["1 星期前", F.week], ["1 個月前", F.month], ["1 年前", F.year]].filter(x => x[1] != null);
  const tip = kind === "stock"
    ? `<b>點配合用：</b>只作參考，唔改 V2.2 規則。2020-07 起（得 2022 同 2025 兩次大跌，樣本好細）：V2.2 紅燈而指數 &lt; 25 嘅日子，NDX 之後 60 日平均 +7.8%；紅燈但只係 25–55，之後 60 日平均 −1.4%。即係<b>紅燈 + 極度恐慌 = 留意見底</b>（配合上面「牛市回調」卡同大市突破）；2025-04-09 大陽燭嗰日指數得 10。`
    : `<b>訊號：</b>指數 ≤ 20 = <b>加密極度恐慌抄底訊號</b>（唔改 ETH 策略，自己決定）。2018 起回測：ETH 策略 B 加「≤ 20 都當抄底」年化 62% → 78%、Sharpe 1.03 → 1.16（主要係極度恐慌時唔好追空）；「≥ 80–90 就走」冇幫助。`;
  const sig = kind === "crypto" && v <= 20 ? `<div class="alert"><b>加密極度恐慌訊號：指數 ${Math.round(v)} ≤ 20</b><p class="small">歷史上係抄底／唔好追空嘅時候（只係訊號，ETH 策略照舊）。</p></div>` : "";
  return sig + `<div class="card"><div class="row spread"><div><div class="small muted">${kind === "stock" ? "股市" : "加密"}恐慌貪婪指數</div>
      <div class="status ${fngCls(v)}" style="font-size:16px">${esc(F.rating)}</div></div>

let FEED = {news:null, econ:null, err:null, at:0, busy:false}, NT = "econ", NCAT = "全部", EALL = false;
try { NT = localStorage.getItem(KEY + "-nt") || "econ"; } catch(e){}
function fromET(t){
  if (t.length === 10) return null;
  for (const off of [4, 5]){ const d = new Date(Date.parse(t + ":00Z") + off * 3600e3); const p = parts(NY, d); if (`${p.date}T${p.time}` === t) return d; }
  return new Date(Date.parse(t + ":00Z") + 4 * 3600e3);
}
const WD = "日一二三四五六";
const dayLabel = ds => { const d = new Date(ds + "T12:00:00Z"); return `${ds.slice(5).replace("-", "/")} 星期${WD[d.getUTCDay()]}`; };
const ago = t => { const m = (Date.now() - Date.parse(t)) / 60e3; return m < 60 ? `${Math.max(1, Math.round(m))} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 日前`; };

// 撳「重新整理」：有 GitHub token 就即刻觸發雲端更新（feeds.yml workflow_dispatch），之後每 15 秒睇下有冇新數據（最多 5 分鐘）
const repoOf = () => { const m = /githubusercontent\.com\/([^/]+\/[^/]+)\//.exec(S.feedUrl || ""); return m ? m[1] : "ngheioffical-glitch/stock-app"; };
async function cloudRefresh(){
  if (!S.ghToken){ fetchFeeds(true); return; }
  const before = FEED.news && FEED.news.generated;
  FEED.cloud = "觸發緊雲端更新…"; render();
  try {
    const r = await fetch(`https://api.github.com/repos/${repoOf()}/actions/workflows/feeds.yml/dispatches`, {method: "POST",
      headers: {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + S.ghToken, "X-GitHub-Api-Version": "2022-11-28"},
      body: JSON.stringify({ref: "main"})});
    if (r.status !== 204) throw new Error("GitHub 回覆 HTTP " + r.status + (r.status === 401 || r.status === 403 ? "（token 錯或者冇 Actions 權限）" : ""));
  } catch(e){ FEED.cloud = "觸發唔到：" + e.message; render(); fetchFeeds(true); return; }
  const t0 = Date.now();
  const tick = async () => {
    await fetchFeeds(true);
    const now = FEED.news && FEED.news.generated;
    if (now && now !== before){ FEED.cloud = "已更新（" + now + "）"; fetchHyper(); fetchBtc(); fetchFng(); render(); setTimeout(() => { FEED.cloud = ""; if (TAB === "news") render(); }, 8000); return; }
    if (Date.now() - t0 > 5 * 60e3){ FEED.cloud = "雲端仲未更新完，遲啲再撳"; render(); return; }
    FEED.cloud = `雲端更新中（約 1–2 分鐘）… ${Math.round((Date.now() - t0) / 1e3)} 秒`; render();
    setTimeout(tick, 15e3);
  };
  setTimeout(tick, 20e3);
}
async function fetchFeeds(force){
  if (FEED.busy || (!force && Date.now() - FEED.at < 5 * 60e3 && FEED.news)) return;
  FEED.busy = true;
  try {
    const base = S.feedUrl.endsWith("/") ? S.feedUrl : S.feedUrl + "/";
    const get = async f => { const r = await fetch(base + f + "?t=" + Math.floor(Date.now() / 60e3), {cache:"no-store"}); if (!r.ok) throw new Error(f + " HTTP " + r.status); return r.json(); };
    [FEED.news, FEED.econ] = await Promise.all([get("news.json"), get("econ.json")]);
    FEED.err = null; FEED.at = Date.now();
  } catch(e){ FEED.err = e.message; }
  FEED.busy = false;
  if (TAB === "news" || TAB === "crypto") render();
}

// 聯儲局文件 AI 總結（scanner/ai.py 讀聯儲局官網全文：FOMC 聲明、會議紀錄、褐皮書、官員講話）
const toneTag = t => !t ? "" : `<span class="tag ${/鷹/.test(t) ? "t-warn" : /鴿/.test(t) ? "t-buy" : "t-dim"}">${esc(t)}</span>`;
function fedDoc(f, open){
  return `<details class="exp fed" ${open ? "open" : ""}><summary><span class="tag t-cyan">${esc(f.kind)}</span> ${toneTag(f.tone)} <b>${esc(f.title)}</b>
    <span class="small muted">· ${esc(parts(HK, new Date(f.t)).date)}</span></summary>
    <ul style="margin:6px 0 0;padding-left:18px;line-height:1.55">${f.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    ${f.change ? `<p class="small"><b>同上次比：</b>${esc(f.change)}</p>` : ""}${f.impact ? `<p class="small"><b>對市場：</b>${esc(f.impact)}</p>` : ""}
    <p class="small muted"><a href="${esc(f.link)}" target="_blank" rel="noopener">聯儲局原文</a> · AI 總結（${esc(f.model || "AI")}），可能有錯漏</p></details>`;
}
function fedCard(){
  const F = (FEED.news && FEED.news.fed) || [];
  if (!F.length) return "";
  return `<details class="card" ${NT === "news" ? "open" : ""}><summary><b>聯儲局文件總結</b> <span class="small muted">· 最近 ${F.length} 份</span></summary>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${F.slice(0, 8).map((f, i) => fedDoc(f, i === 0)).join("")}</div></details>`;
}
function fedFor(r){           // 經濟數據行：議息／會議紀錄／主席講話 → 同日（前後一日）嘅聯儲局文件
  const F = (FEED.news && FEED.news.fed) || [];
  const want = {"聯儲局會議紀錄": /會議紀錄/, "聯儲局議息": /聲明/, "聯儲局主席講話": /講話/}[r.zh];
  if (!want) return "";
  const d0 = Date.parse(r.t.slice(0, 10) + "T12:00:00Z");
  const f = F.find(f => want.test(f.kind) && Math.abs(Date.parse(f.t) - d0) < 1.5 * 86400e3);
  return f ? fedDoc(f, true) : "";
}

function econNote(r, cmp){
  const I = ECON_INFO[r.zh];
  // AI 即時解讀（scanner/ai.py：公佈後第一次更新就寫、45 分鐘後按市場反應再寫一次）
  const ai = (r.ai ? `<div class="exp aiexp"><b>AI 解讀</b> ${mdl(r.ai_model)}<span class="small muted">（${r.ai_stage >= 2 ? "市場反應後更新" : "初步"}${r.ai_at ? " · " + esc(parts(HK, new Date(r.ai_at)).time) : ""}；市場反應 = 公佈後至今）</span><p>${esc(r.ai)}</p></div>` : "") + fedFor(r);
  if (!I) return ai;
  const eff = cmp === "高過預測" ? I.up : cmp === "低過預測" ? I.dn : "";
  return ai + `<details class="exp"><summary>${r.ai ? "基本解釋：係咩？點影響？" : eff ? `<b>解讀</b>：${esc(eff)}` : "係咩？點影響？"}</summary>
    <p><b>係咩：</b>${esc(I.what)}</p><p><b>點解重要：</b>${esc(I.why)}</p>
    ${I.up ? `<p><b>高過預測：</b>${esc(I.up)}</p><p><b>低過預測：</b>${esc(I.dn)}</p>` : ""}
    <p class="muted">市場反應睇「同預測差幾多」，唔係數字本身；同時出幾個數據、或者市場早有預期，反應可以相反。</p></details>`;
}

function jumpToday(smooth){
  const el = $(".dayhd.now") || $(".ev.next") || [...document.querySelectorAll(".dayhd")].pop();
  FEED.scrolled = true;
  if (!el) return;
  requestAnimationFrame(() => window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 10, behavior: smooth ? "smooth" : "auto"}));
}
function viewEcon(){
  const E = FEED.econ;
  const rows = E.rows.filter(r => EALL || r.imp >= 2).map(r => ({...r, d: fromET(r.t)}));
  const nowHK = parts(HK, new Date()).date;
  let h = `<div class="chips"><button data-eall="0" aria-pressed="${!EALL}">重要數據</button><button data-eall="1" aria-pressed="${EALL}">全部</button></div>
    <p class="small muted">香港時間（括號係美東）· 來源 ${esc(E.src)} · 更新 ${esc(E.generated)}</p><button class="todayfab" id="goToday" aria-label="跳去今日">今日</button><div class="card" style="gap:0;padding-top:4px">`;
  let last = "", nextMarked = false;
  for (const r of rows){
    const hk = r.d ? parts(HK, r.d) : {date: r.t.slice(0,10), time: "全日"};
    if (hk.date !== last){ h += `<div class="dayhd ${hk.date === nowHK ? "now" : ""}">${dayLabel(hk.date)}${hk.date === nowHK ? " · 今日" : ""}</div>`; last = hk.date; }
    const done = r.actual != null;
    const soon = !done && !nextMarked && r.d && r.d > new Date() && (nextMarked = true);
    const cmp = done && r.forecast ? (() => { const a = parseFloat(String(r.actual).replace(/[^\d.-]/g,"")), f = parseFloat(String(r.forecast).replace(/[^\d.-]/g,"")); return isFinite(a) && isFinite(f) && a !== f ? (a > f ? "高過預測" : "低過預測") : (isFinite(a) && a === f ? "同預測一樣" : ""); })() : "";
    h += `<div class="ev ${done ? "done" : ""}${soon ? " next" : ""}"><div class="tm">${hk.time}<br><small>(${r.t.length > 10 ? r.t.slice(11) : "—"})</small></div>
      <div class="nm"><span class="imp i${r.imp || 1}"><i></i><i></i><i></i></span>${esc(r.zh || r.name)}${soon ? ` <span class="tag t-warn">下一個</span>` : ""}${cmp ? ` <span class="tag t-dim">${cmp}</span>` : ""}${r.zh ? `<span class="en">${esc(r.name)}</span>` : ""}</div>
      <div class="vals"><div>實際<b class="act">${esc(r.actual ?? "未公佈")}</b></div><div>預測<b>${esc(r.forecast ?? "—")}</b></div><div>上次<b>${esc(r.previous ?? "—")}</b></div></div>${econNote(r, cmp)}</div>`;
  }
  return h + (rows.length ? "" : `<p class="muted">冇數據</p>`) + `</div>`;
}

  if (!SER) return `<p class="muted">載入中…</p>`;
  const cand = new Set(SCAN ? SCAN.ranking.filter(r => r.status === "候選").map(r => r.sym) : []);
  const search = `<div class="row" style="flex-wrap:nowrap"><input id="serq" placeholder="輸入代號睇 Serenity 全部講法，例如 LITE" value="${esc(SERSYM)}" autocapitalize="characters"><button id="serGo">搵</button></div>`;
  if (SERSYM) return search + viewSerHist(cand);
  const top = Object.entries(SER.by).sort((a, b) => b[1].n - a[1].n).slice(0, 15);
  let h = search + `<div class="card"><span class="small muted">近 30 日提得最多（青色 = V2.2 候選股；撳落去睇全部講法）</span><div class="row">${top.map(([s, o]) => `<span class="tag ${cand.has(s) ? "t-cyan" : "t-dim"}" data-sersym="${s}" role="button">${s} ${o.n}</span>`).join("")}</div></div>`;
  h += `<div class="card" style="gap:0;padding-top:2px;padding-bottom:2px">` + (SER.list.length ? SER.list.slice(0, 80).map(t => `<div class="news"><a href="https://x.com/aleabitoreddit/status/${t.id}" target="_blank" rel="noopener">${esc(t.zh || t.text)}</a>${t.zh ? `<span class="small muted">${esc(t.text)}</span>` : ""}
    <div class="meta">${t.syms.map(s => `<span class="tag ${cand.has(s) ? "t-cyan" : "t-dim"}" data-sersym="${s}" role="button">${s}</span>`).join("")}<span>${t.reply ? "回覆" : "推文"}</span><span>${ago(new Date(t.ts * 1e3).toISOString())}</span>${t.zm ? `<span class="zm">譯：${esc(String(t.zm).replace(/^github:/, ""))}</span>` : ""}</div></div>`).join("") : `<p class="muted" style="padding:10px 0">近 30 日冇提過股票</p>`) + `</div>`;
  return h + `<p class="small muted">Serenity（X @aleabitoreddit）近 30 日有 cashtag 嘅推文。回測：佢提嘅時候技術面已經合格嘅股，之後 60 日平均好過 QQQ；唔合格嘅差過 QQQ。只供參考，唔係買入訊號。</p>`;
}

function viewNews(){
  if (!FEED.news && !FEED.err) fetchFeeds();
  let h = topbar() + `<div class="row spread"><div class="chips"><button data-nt="econ" aria-pressed="${NT === "econ"}">經濟數據</button><button data-nt="news" aria-pressed="${NT === "news"}">新聞</button></div>
    <button id="feedReload" class="small">${FEED.busy ? "更新中…" : "重新整理"}</button></div>`;
  if (FEED.cloud) h += `<p class="small" style="color:var(--cyan)">${esc(FEED.cloud)}</p>`;
  if (FEED.err) h += `<div class="alert"><b>讀唔到新聞數據</b><p class="small">${esc(FEED.err)}</p></div>`;
  if (!FEED.news || !FEED.econ) return h + (FEED.err ? "" : `<p class="muted">載入中…</p>`);
  const D = FEED.news.digest;           // Gemini「今日重點」（scanner/ai.py，GitHub 每 30 分鐘；冇 key 就冇）
  if (D && (D.points || []).length){
    const sn = (D.snap || []).map(x => `<span>${esc(x.name)} <b class="${x.chg >= 0 ? "up" : "dn"}">${x.unit === "bp" ? (x.chg >= 0 ? "+" : "") + x.chg.toFixed(1) + " 基點" : pct(x.chg / 100, 2)}</b></span>`).join("");
    const fc = D.checked ? ((D.warn || []).length ? `<div class="alert small"><b>事實核對：有 ${D.warn.length} 處同實際數字唔符</b>${D.warn.map(w => `<div>· ${esc(w)}</div>`).join("")}</div>`
                                               : `<p class="small up">✓ 市場升跌已同實際數字核對${D.tries > 1 ? "（第一版有錯，已自動重寫）" : ""}</p>`) : "";
    h += `<details class="card" ${NT === "news" ? "open" : ""}><summary><b>AI 今日重點</b> <span class="small muted">· ${esc(D.generated)}</span> ${mdl(D.model)}</summary>
    <ul style="margin:6px 0 0;padding-left:18px;line-height:1.55">${D.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    ${D.econ ? `<p class="small" style="margin-top:6px"><b>經濟數據：</b>${esc(D.econ)}</p>` : ""}
    ${sn ? `<div class="snap small"><span class="muted">全日實際（最新 vs 上日收市${D.snap[0] && D.snap[0].at ? "，" + esc(D.snap[0].at) : ""}）</span>${sn}</div>` : ""}${fc}
    <p class="small muted">${esc(D.model || "AI")} 根據最近 18 小時新聞標題、已公佈數據同上面實際市場數字自動生成，可能有錯漏，唔係投資建議；撳新聞睇原文。注意：經濟數據解讀嘅市場反應係「公佈後至今」，同呢度嘅「全日」可以方向唔同。</p></details>`;
  }
  h += fedCard();
  return h + (NT === "econ" ? viewEcon() : viewNewsList());
}

const ORDER = ["today", "model", "rank", "news", "crypto", "ser", "trump"];     // 設定唔喺底部導航（頂部齒輪）
// anim："r"／"l" = 由右／左滑入（轉分頁），"f" = 淡入（頁內切換），冇 = 數據更新唔郁
function render(anim){
  const app = $("#app");
  app.innerHTML = ({today:viewToday, model:viewModel, rank:viewRank, news:viewNews, crypto:viewCrypto, ser:viewSer, trump:viewTrump, set:viewSet}[TAB] || viewToday)();
  document.querySelectorAll("#tabs button").forEach(b => b.dataset.tab === TAB ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const pill = $("#tabs .pill"); if (pill){ const k = ORDER.indexOf(TAB); pill.style.opacity = k < 0 ? 0 : 1; if (k >= 0) pill.style.transform = `translateX(${k * 100}%)`; }
  if (anim === "r" || anim === "l"){
    [...app.children].slice(0, 12).forEach((el, i) => { el.style.setProperty("--i", i); el.style.setProperty("--dx", anim === "r" ? "26px" : "-26px"); el.classList.add("rise"); });
  } else if (anim === "f"){
    app.classList.remove("fadein"); void app.offsetWidth; app.classList.add("fadein");
  }
  bind();
  if (TAB === "news" && NT === "econ" && FEED.econ && !FEED.scrolled) jumpToday();   // 每次入經濟日曆：跳去今日（冇今日就下一個數據）
}

function bind(){
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#saveSet", () => { const c = +$("#capital").value; S.capital = isFinite(c) && c > 0 ? c : 0;
    S.dataUrl = $("#dataUrl").value.trim() || defaults.dataUrl; S.feedUrl = $("#feedUrl").value.trim() || defaults.feedUrl;
    S.liveUrl = $("#liveUrl").value.trim() || defaults.liveUrl; S.ghToken = $("#ghToken").value.trim(); save(); FEED.at = 0; fetchScan(); fetchLive(); });
  on("#reload", () => fetchScan());
  on("#feedReload", () => { cloudRefresh(); render(); });
  on("#goToday", () => jumpToday(true));
  on("#fGo", () => { const c = +$("#fCap").value, d = $("#fStart").value;
    if (!(c > 0)){ alert("請填本金（美元）"); return; }
    if (!d || d < "2000-01-03"){ alert("開始日期要喺 2000-01-03 之後"); return; }
    S.follow = {capital: c, start: d}; save(); pickModel(); HCACHE = {}; render("f"); });
  document.querySelectorAll("[data-acct]").forEach(b => b.onclick = () => setAcct(b.dataset.acct));
  document.querySelectorAll("[data-mtab]").forEach(b => b.onclick = () => { MTAB = b.dataset.mtab; try { localStorage.setItem("mtab", MTAB); } catch(e){} render("f"); window.scrollTo(0, 0); });
  on("#fClear", () => { if (confirm("停止跟單？（只係清除呢部手機嘅記錄）")){ S.follow = null; save(); render("f"); } });
  on("#goSet", () => go(TAB === "set" ? (LASTTAB || "today") : "set"));
  on("#serReload", () => { fetchSer(); });
  on("#trReload", () => { fetchTrump(); });
  on("#btcReload", () => { fetchBtc(); fetchFng(); fetchHyper(); fetchFeeds(true); if (S.ghToken) cloudRefresh(); });
  document.querySelectorAll("[data-nt]").forEach(b => b.onclick = () => { if (b.dataset.nt === "econ") FEED.scrolled = false; NT = b.dataset.nt; try{localStorage.setItem(KEY+"-nt",NT);}catch(e){} render("f"); });
  document.querySelectorAll("[data-ncat]").forEach(b => b.onclick = () => { NCAT = b.dataset.ncat; render("f"); });
  document.querySelectorAll("[data-hmode]").forEach(b => b.onclick = () => { HMODE = b.dataset.hmode; try{localStorage.setItem(KEY+"-hmode",HMODE);}catch(e){} render("f"); });
  const hy = $("#histY"); if (hy) hy.onchange = () => histYear(hy.value);
  document.querySelectorAll("[data-hmv]").forEach(b => b.onclick = () => histMove(b.dataset.hmv.endsWith("f") ? b.dataset.hmv : +b.dataset.hmv));
  const hr = $("#histR"); if (hr) hr.oninput = () => { HIDX[hkey()] = +hr.value; histPaint(); };
  document.querySelectorAll("[data-hyear]").forEach(b => b.onclick = () => histYear(b.dataset.hyear));
  document.querySelectorAll("[data-hsrc]").forEach(b => b.onclick = () => { HSRC = b.dataset.hsrc; render("f"); });
  on("#hGo", () => histRange($("#hA").value, $("#hB").value));
  document.querySelectorAll("[data-sersym]").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); openSer(b.dataset.sersym); });
  document.querySelectorAll("[data-trsym]").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); openTr(b.dataset.trsym); });
  on("#trGo", () => openTr($("#trq").value));
  const tq = $("#trq"); if (tq) tq.onkeydown = e => { if (e.key === "Enter") openTr(tq.value); };
  on("#serGo", () => openSer($("#serq").value));
  const q = $("#serq"); if (q) q.onkeydown = e => { if (e.key === "Enter") openSer(q.value); };
  document.querySelectorAll("[data-eall]").forEach(b => b.onclick = () => { EALL = b.dataset.eall === "1"; render("f"); });
}

let LASTTAB = null;
function go(tab){
  if (tab === TAB){ window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (tab === "set") LASTTAB = TAB;
  const dir = tab === "set" ? "r" : (TAB === "set" ? "l" : (ORDER.indexOf(tab) > ORDER.indexOf(TAB) ? "r" : "l"));
  TAB = tab; try{localStorage.setItem(KEY+"-tab",TAB);}catch(e){}
  if (tab === "news") FEED.scrolled = false;          // 每次入新聞：經濟日曆跳返今日
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8); } catch(e){}
  window.scrollTo(0,0); render(dir);
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
$("#app").addEventListener("animationend", e => { if (e.target.classList.contains("rise")) e.target.classList.remove("rise"); else if (e.target.id === "app") e.target.classList.remove("fadein"); });
// 左右掃切換分頁（喺可以橫向捲動嘅地方、輸入框、拉桿上面唔會觸發）
let SWP = null;
const hscroll = el => { for (; el && el !== document.body; el = el.parentElement){ if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true; } return false; };
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || e.target.closest("input,select,textarea,nav") || hscroll(e.target)) { SWP = null; return; }
  SWP = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()};
}, {passive:true});
document.addEventListener("touchend", e => {
  if (!SWP) return;
  const c = e.changedTouches[0], dx = c.clientX - SWP.x, dy = c.clientY - SWP.y, dt = Date.now() - SWP.t; SWP = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * 0.5 && dt < 600){
    const i = ORDER.indexOf(TAB) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < ORDER.length) go(ORDER[i]);
  }
}, {passive:true});

async function fetchScan(){
  try {
    const r = await fetch(S.dataUrl + (S.dataUrl.includes("?")?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    SCAN = await r.json(); ERR = null;
  } catch(e){ ERR = e.message; }
  render();
  splashDone();
}

// ───────────────────────── 開 app 動畫：最少 1.7 秒，數據到咗先收（最多 4 秒）
const SPLASH = {t0: performance.now(), done: false};
(function(){
  const steps = [[0, "CONNECTING DATA FEED", 18], [450, "SCANNING MARKET LEADERS", 52], [950, "CALIBRATING SIGNALS", 80]];
  steps.forEach(([ms, txt, w]) => setTimeout(() => { if (SPLASH.done) return; const s = $("#spSub"), b = $("#spBar"); if (s) s.textContent = txt; if (b) b.style.width = w + "%"; }, ms));
  setTimeout(splashDone, 4000);
})();
function splashDone(){
  if (SPLASH.done) return;
  const sp = $("#splash");
  if (!sp){ SPLASH.done = true; return; }
  const wait = Math.max(0, 1700 - (performance.now() - SPLASH.t0));
  SPLASH.done = true;
  setTimeout(() => {
    const s = $("#spSub"), b = $("#spBar"); if (s) s.textContent = "READY"; if (b) b.style.width = "100%";
    setTimeout(() => { sp.classList.add("out"); render("r"); setTimeout(() => sp.remove(), 600); }, 260);
  }, wait);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
fetchScan();
fetchModel();
fetchLive();
fetchSer();
fetchTrump();
fetchBtc(); fetchFng(); fetchHyper();
setInterval(() => { if (document.visibilityState === "visible"){ fetchBtc(); fetchFng(); fetchHyper(); } }, 5 * 60e3);
fetchLev();
setInterval(() => { if (document.visibilityState === "visible") fetchLive(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") fetchLive(); });
